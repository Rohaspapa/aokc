<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="식단">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon" sizes="360x360" href="icon-360.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#0F4C36">
<title>오늘의 식단 — AOKC 2026</title>
<style>
:root {
  --c-bg: #F5F2EA;
  --c-surface: #FFFFFF;
  --c-surface-2: #FAF8F2;
  --c-border: #E0DCCF;
  --c-text: #1A1916;
  --c-muted: #7A7468;
  --c-accent: #0F4C36;
  --c-accent-2: #1D6B47;
  --c-accent-light: #DCE9E1;
  --c-amber: #B57318;
  --c-amber-light: #F8EBCF;
  --c-coral: #B8412A;
  --c-coral-light: #F8E2DA;
  --c-blue: #1A5CA0;
  --c-blue-light: #DEEAF7;
  --c-purple: #5C3DAF;
  --c-purple-light: #E8E2F5;
  --c-good: #2D7A4E;
  --c-line: #E0DCCF;
  --c-ink: #1A1916;
  --c-ink-soft: #7A7468;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  /* 모달 높이·오프셋 — 키보드 등장 시 JS가 덮어씀 */
  --modal-h: 78vh;
  --modal-offset: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  background: var(--c-bg); color: var(--c-text); min-height: 100vh;
  font-size: 14px; line-height: 1.5; padding-bottom: calc(20px + var(--safe-bottom));
}
.header {
  background: -webkit-linear-gradient(180deg, #0F4C36 0%, #1D6B47 100%);
  background: linear-gradient(180deg, #0F4C36 0%, #1D6B47 100%);
  color: #fff; padding: 16px 18px 14px; position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.header-row {
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center;
}
.back-btn {
  background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 10px;
  border-radius: 6px; font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.content { padding: 14px; }

.toggle-section {
  display: -webkit-flex; display: flex; background: var(--c-surface-2);
  border: 1px solid var(--c-border); border-radius: 10px; padding: 3px; margin-bottom: 12px;
}
.toggle-btn {
  -webkit-flex: 1; flex: 1; padding: 8px; font-size: 12px; font-weight: 600;
  background: transparent; border: none; border-radius: 8px; color: var(--c-muted);
  cursor: pointer; font-family: inherit;
}
.toggle-btn.on {
  background: var(--c-surface); color: var(--c-text);
  -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

.date-bar {
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
}
.date-btn {
  background: var(--c-accent-light); color: var(--c-accent); border: none;
  width: 32px; height: 32px; border-radius: 8px; font-size: 18px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.date-text { font-size: 14px; font-weight: 700; text-align: center; }
.date-text .sub { display: block; font-size: 11px; font-weight: 500; color: var(--c-muted); margin-top: 2px; }

/* 준수율 패널 */
.score-panel {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 14px; padding: 16px; margin-bottom: 12px; text-align: center;
}
.score-num { font-size: 38px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: var(--c-accent); }
.score-num.mid { color: var(--c-amber); }
.score-num.low { color: var(--c-muted); }
.score-num .pct { font-size: 18px; font-weight: 700; }
.score-bar { background: var(--c-border); height: 8px; border-radius: 4px; overflow: hidden; margin: 12px 0 8px; }
.score-fill {
  height: 100%; border-radius: 4px;
  background: -webkit-linear-gradient(left, var(--c-accent), var(--c-accent-2));
  background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2));
  -webkit-transition: width 0.3s; transition: width 0.3s;
}
.score-msg { font-size: 12.5px; line-height: 1.5; color: var(--c-text); }
.score-msg.good { color: var(--c-good); font-weight: 600; }
.week-tag {
  display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 9px;
  border-radius: 10px; background: var(--c-accent-light); color: var(--c-accent); margin-bottom: 8px;
}

/* 식사 카드 */
.meal-card {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 14px; padding: 14px; margin-bottom: 10px;
}
.meal-card.done { border-color: #A7CFB8; background: #FBFDFB; }
.meal-card.free { border-color: #E8D4A0; background: -webkit-linear-gradient(135deg,#FFFDF6,#FBF6E8); background: linear-gradient(135deg,#FFFDF6,#FBF6E8); }
.meal-head {
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center; margin-bottom: 8px;
}
.meal-title { font-size: 14px; font-weight: 700; }
.carb-tag { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 10px; }
.carb-tag.high { background: var(--c-blue-light); color: var(--c-blue); }
.carb-tag.mid  { background: var(--c-accent-light); color: var(--c-accent); }
.carb-tag.low  { background: var(--c-surface-2); color: var(--c-muted); border: 1px solid var(--c-border); }
.carb-tag.free { background: var(--c-amber-light); color: #6B5510; }
.meal-menu { font-size: 13.5px; line-height: 1.55; color: var(--c-text); margin-bottom: 6px; }
.meal-note {
  font-size: 11.5px; line-height: 1.5; color: var(--c-muted);
  padding: 6px 9px; background: var(--c-surface-2); border-radius: 7px; margin-bottom: 4px;
}
.meal-note.kid { background: var(--c-blue-light); color: #0E3F73; }
.meal-note.kid2 { background: var(--c-purple-light); color: #3D2E6B; }
.carb-tag.box { background: var(--c-purple-light); color: var(--c-purple); }
.safety-item { font-size: 11.5px; line-height: 1.55; padding: 9px 11px; background: var(--c-coral-light); color: #6B1E0E; border-radius: 8px; margin-bottom: 6px; }
.safety-item b.h { display: block; font-weight: 800; margin-bottom: 2px; }
.meal-note.adult { background: var(--c-accent-light); color: var(--c-accent); }
.meal-note b { font-weight: 700; }

.pick-row { display: -webkit-flex; display: flex; gap: 5px; margin-top: 10px; }
.pick-btn {
  -webkit-flex: 1; flex: 1; padding: 9px 2px; font-size: 11px; font-weight: 700;
  background: var(--c-surface-2); border: 1.5px solid var(--c-border); border-radius: 9px;
  color: var(--c-muted); cursor: pointer; font-family: inherit;
  -webkit-transition: all 0.15s; transition: all 0.15s;
}
.pick-btn:active { -webkit-transform: scale(0.96); transform: scale(0.96); }
.pick-btn.on { background: var(--c-accent); border-color: var(--c-accent); color: #fff; }
.pick-btn.on.skip { background: var(--c-muted); border-color: var(--c-muted); }
.pick-btn.on.school { background: var(--c-blue); border-color: var(--c-blue); }

/* 학식 3원칙 */
.l3-box { margin-top: 10px; padding: 10px; background: var(--c-blue-light); border-radius: 9px; }
.l3-title { font-size: 11px; font-weight: 800; color: #0E3F73; margin-bottom: 6px; }
.check-row {
  display: -webkit-flex; display: flex;
  -webkit-align-items: flex-start; align-items: flex-start;
  padding: 7px 0; cursor: pointer; -webkit-user-select: none; user-select: none;
}
.checkbox {
  width: 22px; height: 22px; border: 2px solid var(--c-muted); border-radius: 6px;
  -webkit-flex-shrink: 0; flex-shrink: 0; margin-right: 10px; position: relative;
  -webkit-transition: all 0.15s; transition: all 0.15s; background: #fff;
}
.checkbox.done { background: var(--c-accent); border-color: var(--c-accent); }
.checkbox.done:after {
  content: ''; position: absolute; left: 5px; top: 1px; width: 6px; height: 11px;
  border: solid #fff; border-width: 0 2.5px 2.5px 0;
  -webkit-transform: rotate(45deg); transform: rotate(45deg);
}
.check-text { -webkit-flex: 1; flex: 1; font-size: 12.5px; line-height: 1.45; }
.check-text .sub { display: block; font-size: 10.5px; color: var(--c-muted); margin-top: 1px; }
.check-row.done .check-text { color: var(--c-muted); }

/* 물·약 */
.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.mini-btn {
  background: var(--c-surface); border: 1.5px solid var(--c-border); border-radius: 12px;
  padding: 13px 8px; text-align: center; cursor: pointer; font-family: inherit;
  -webkit-transition: all 0.15s; transition: all 0.15s; -webkit-user-select: none; user-select: none;
}
.mini-btn:active { -webkit-transform: scale(0.97); transform: scale(0.97); }
.mini-btn.on { background: var(--c-accent-light); border-color: var(--c-accent); }
.mini-icon { font-size: 20px; display: block; margin-bottom: 3px; }
.mini-label { font-size: 12px; font-weight: 700; color: var(--c-text); }
.mini-sub { font-size: 10px; color: var(--c-muted); margin-top: 1px; }

/* 접이식 섹션 */
.fold {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 14px; margin-bottom: 10px; overflow: hidden;
}
.fold-head {
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center;
  padding: 13px 14px; cursor: pointer; -webkit-user-select: none; user-select: none;
}
.fold-title { font-size: 13px; font-weight: 700; }
.fold-meta { font-size: 11px; color: var(--c-muted); font-weight: 600; }
.fold-body { padding: 0 14px 14px; }

/* 예외 칩 */
.exc-chips { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 6px; }
.exc-chip {
  background: var(--c-surface-2); border: 1.5px solid var(--c-border); border-radius: 16px;
  padding: 7px 13px; font-size: 12px; font-weight: 600; color: var(--c-muted);
  cursor: pointer; font-family: inherit;
}
.exc-chip.on { background: var(--c-amber-light); border-color: var(--c-amber); color: #6B5510; }
.exc-note { font-size: 11px; color: var(--c-muted); margin-top: 8px; line-height: 1.5; }

/* 자유기록 */
.chip-area {
  display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap;
  gap: 6px; min-height: 30px; padding: 8px; background: var(--c-surface-2);
  border-radius: 8px; margin-bottom: 8px;
}
.chip-area.empty:before { content: '기록 없음'; color: var(--c-muted); font-size: 12px; padding: 3px; }
.chip {
  background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 16px;
  padding: 5px 8px 5px 11px; font-size: 12px; font-weight: 500;
  display: -webkit-inline-flex; display: inline-flex;
  -webkit-align-items: center; align-items: center; gap: 6px;
}
.chip.danger { background: var(--c-coral-light); border-color: #E8B6A8; color: #6B1E0E; }
.chip.warn { background: var(--c-amber-light); border-color: #E8D4A0; color: #6B5510; }
.chip.good { background: var(--c-accent-light); border-color: #A7CFB8; color: var(--c-accent); }
.chip-x {
  background: rgba(0,0,0,0.1); border: none; width: 16px; height: 16px; border-radius: 50%;
  font-size: 11px; line-height: 1; cursor: pointer; font-family: inherit; color: inherit; padding: 0;
}
.sub-label { font-size: 11px; font-weight: 700; color: var(--c-muted); margin: 8px 0 4px; }
.add-food-btn {
  width: 100%; background: var(--c-accent-light); color: var(--c-accent);
  border: 1px dashed var(--c-accent); padding: 9px; border-radius: 8px;
  font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.grade-line {
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center;
  padding: 9px 11px; background: var(--c-surface-2); border-radius: 9px; margin-bottom: 10px;
}
.grade-badge { font-size: 22px; font-weight: 800; }
.grade-badge.A { color: var(--c-good); }
.grade-badge.B { color: var(--c-accent); }
.grade-badge.C { color: var(--c-amber); }
.grade-badge.D { color: var(--c-coral); }
.grade-badge.F { color: #8B1F0E; }
.grade-txt { font-size: 11.5px; color: var(--c-muted); -webkit-flex: 1; flex: 1; margin-left: 10px; line-height: 1.45; }

/* 인사이트 */
.insight-row { font-size: 12px; padding: 8px 10px; border-radius: 8px; margin-top: 6px; line-height: 1.5; }
.insight-row.bad { background: var(--c-coral-light); color: #6B1E0E; }
.insight-row.warn { background: var(--c-amber-light); color: #6B5510; }
.insight-row.good { background: var(--c-accent-light); color: var(--c-accent); }
.insight-row.neutral { background: var(--c-surface-2); color: var(--c-text); }

/* 모달 */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 500;
  -webkit-justify-content: center; justify-content: center;
  -webkit-align-items: flex-end; align-items: flex-end;
}
.modal-overlay.on { display: -webkit-flex; display: flex; }
.modal {
  background: var(--c-surface); width: 100%; max-width: 500px;
  height: var(--modal-h, 78vh); max-height: var(--modal-h, 78vh);
  -webkit-transform: translateY(var(--modal-offset, 0px)); transform: translateY(var(--modal-offset, 0px));
  border-radius: 18px 18px 0 0;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-transition: -webkit-transform 0.2s ease, height 0.2s ease;
  transition: transform 0.2s ease, height 0.2s ease; overflow: hidden;
}
.modal-head {
  padding: 14px 16px 10px; border-bottom: 1px solid var(--c-border);
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.modal-title { font-size: 14px; font-weight: 700; }
.modal-title small { color: var(--c-muted); font-weight: 500; }
.modal-close {
  background: transparent; border: none; font-size: 22px; color: var(--c-muted);
  cursor: pointer; padding: 0 4px; font-family: inherit;
}
.search-bar { padding: 10px 14px; border-bottom: 1px solid var(--c-border); -webkit-flex-shrink: 0; flex-shrink: 0; }
.search-input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--c-border); border-radius: 8px;
  font-size: 14px; font-family: inherit; -webkit-appearance: none; appearance: none;
}
.search-input:focus { outline: none; border-color: var(--c-accent); }
.cat-tabs {
  display: -webkit-flex; display: flex; -webkit-flex-wrap: nowrap; flex-wrap: nowrap;
  -webkit-flex-shrink: 0; flex-shrink: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding: 8px 14px; border-bottom: 1px solid var(--c-border); gap: 6px;
}
.cat-tab {
  background: var(--c-surface-2); border: 1px solid var(--c-border); padding: 7px 12px;
  border-radius: 14px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  cursor: pointer; font-family: inherit; color: var(--c-muted);
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.cat-tab.on { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
.food-list { -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0; }
.food-item {
  padding: 10px 16px; border-bottom: 1px solid var(--c-border);
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center; cursor: pointer;
}
.food-item:active { background: var(--c-surface-2); }
.food-name { font-size: 13.5px; font-weight: 500; }
.food-tags {
  display: -webkit-flex; display: flex; gap: 4px; margin-top: 4px;
  -webkit-flex-wrap: wrap; flex-wrap: wrap;
}
.tag { font-size: 9.5px; padding: 2px 6px; border-radius: 8px; font-weight: 600; }
.tag.gout { background: var(--c-coral-light); color: #6B1E0E; }
.tag.salt { background: var(--c-amber-light); color: #6B5510; }
.tag.fat { background: #F0E5F5; color: var(--c-purple); }
.tag.proc { background: #FCE0CC; color: #8C3D0E; }
.tag.alc { background: #4A2E2E; color: #fff; }
.tag.good { background: var(--c-accent-light); color: var(--c-accent); }
.tag.protein { background: var(--c-blue-light); color: var(--c-blue); }
.tag.pick { border: 1.5px dashed var(--c-border); background: #fff; color: var(--c-muted); padding: 6px 11px; font-size: 11.5px; cursor: pointer; font-family: inherit; border-radius: 12px; }
.tag.pick.on { border-style: solid; }
.food-add-btn {
  background: var(--c-accent); color: #fff; border: none; width: 28px; height: 28px;
  border-radius: 50%; font-size: 18px; line-height: 1; font-weight: 600;
  cursor: pointer; font-family: inherit; -webkit-flex-shrink: 0; flex-shrink: 0;
}
.custom-box { padding: 12px 16px; background: var(--c-surface-2); border-top: 1px solid var(--c-border); }
.custom-title { font-size: 12px; font-weight: 700; margin-bottom: 7px; }
.custom-tags { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.custom-save {
  width: 100%; background: var(--c-accent); color: #fff; border: none; padding: 10px;
  border-radius: 8px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
}

/* 주간 */
.weekly-row {
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  gap: 8px; margin-bottom: 7px; font-size: 12px;
}
.weekly-day { width: 46px; font-weight: 600; color: var(--c-muted); -webkit-flex-shrink: 0; flex-shrink: 0; font-size: 11px; }
.weekly-bar-track { -webkit-flex: 1; flex: 1; height: 18px; background: var(--c-surface-2); border-radius: 4px; overflow: hidden; }
.weekly-bar-fill {
  height: 100%; border-radius: 4px;
  background: -webkit-linear-gradient(left, var(--c-accent), var(--c-accent-2));
  background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2));
}
.weekly-pct { width: 40px; text-align: right; font-weight: 700; font-size: 12px; color: var(--c-accent); -webkit-flex-shrink: 0; flex-shrink: 0; }

/* 식단표 */
.plan-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.plan-table th, .plan-table td { text-align: left; padding: 7px 5px; border-bottom: 1px solid var(--c-border); vertical-align: top; }
.plan-table th { background: var(--c-surface-2); font-size: 10.5px; color: var(--c-muted); font-weight: 700; }
.plan-table td.dow { font-weight: 800; width: 26px; color: var(--c-accent); }
.plan-table tr.today-row { background: #FBFDFB; }
.plan-table tr.today-row td.dow { color: var(--c-coral); }

.empty-state { text-align: center; padding: 24px 16px; color: var(--c-muted); font-size: 12.5px; line-height: 1.6; }
.card {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.card-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.principle {
  background: var(--c-accent-light); border: 1px solid #A7CFB8; border-radius: 10px;
  padding: 11px 13px; font-size: 11.5px; line-height: 1.6; color: var(--c-accent); margin-bottom: 12px;
}
.principle b { font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>🥗 오늘의 식단</h1>

function loadStore() {
  try { var raw = window.localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { dates: {} };
}
function saveStore(s) { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {} }
var store = loadStore();

// ═══════════════════════════════════════════
// 날짜
// ═══════════════════════════════════════════
function dateKey(d) {
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}
function todayDate() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
var currentDate = todayDate();

function mondayOf(d) {
  var dow = d.getDay();
  var off = (dow === 0) ? -6 : (1 - dow);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + off);
}
function weekLetter(d) {
  var diff = Math.round((mondayOf(d) - mondayOf(WEEK_ANCHOR)) / 604800000);
  return (((diff % 2) + 2) % 2 === 0) ? 'A' : 'B';
}
function planFor(d) { return PLAN[weekLetter(d)][d.getDay()]; }

function getDayData() {
  var k = dateKey(currentDate);
  if (!store.dates[k]) store.dates[k] = {};
  var dd = store.dates[k];
  if (!dd.plan) dd.plan = {};
  if (!dd.l3) dd.l3 = {};
  if (!dd.exc) dd.exc = [];
  return dd;
}
function dayDataOf(d) {
  var dd = store.dates[dateKey(d)] || {};
  return { plan: dd.plan || {}, l3: dd.l3 || {}, exc: dd.exc || [],
           water: !!dd.water, med: !!dd.med,
           breakfast: dd.breakfast || [], lunch: dd.lunch || [], dinner: dd.dinner || [], snack: dd.snack || [] };
}

// ═══════════════════════════════════════════
// 준수율
// 아침 1 + 점심 1 + 저녁 1 + 물 1 + 약 1 = 5칸
// 점심을 '학식'으로 고르면 3원칙 체크 비율이 그 칸의 점수
// ═══════════════════════════════════════════
function mealScore(v) { return (v === 'ok' || v === 'alt' || v === 'box') ? 1 : 0; }

function dayScore(d) {
  var dd = dayDataOf(d);
  var got = 0, slots = 5, any = false;
  got += mealScore(dd.plan.b); if (dd.plan.b) any = true;
  if (dd.plan.l === 'school') {
    var n = 0;
    for (var i = 0; i < L3.length; i++) if (dd.l3[L3[i].k]) n++;
    got += n / L3.length; any = true;
  } else { got += mealScore(dd.plan.l); if (dd.plan.l) any = true; }
  got += mealScore(dd.plan.d); if (dd.plan.d) any = true;
  if (dd.water) { got += 1; any = true; }
  if (dd.med) { got += 1; any = true; }
  if (!any) return null;
  return Math.round(got / slots * 100);
}

function scoreMessage(pct) {
  if (pct === null) return { msg:'아직 체크 전이에요', cls:'' };
  if (pct >= 95) return { msg:'완벽한 하루. 이 패턴이 12월을 만듭니다.', cls:'good' };
  if (pct >= 80) return { msg:'아주 좋아요. 이대로만.', cls:'good' };
  if (pct >= 60) return { msg:'괜찮습니다. 한 칸만 더 채워볼까요.', cls:'' };
  if (pct >= 40) return { msg:'절반은 했어요. 내일은 한 칸만 늘려봐요.', cls:'' };
  return { msg:'기록했다는 것만으로 오늘은 성공입니다.', cls:'' };
}

// 자유 기록 분석 (기존 로직 유지)
// ═══════════════════════════════════════════
function getFoodInfo(name) {
  var arr = allFoods();
  for (var i = 0; i < arr.length; i++) if (arr[i].n === name) return arr[i];
  return null;
}
function analyzeDay(d) {
  var dd = dayDataOf(d);
  var counts = { gout:0, salt:0, fat:0, proc:0, alc:0, good:0, protein:0 };
  var meals = ['breakfast','lunch','dinner','snack'];
  var total = 0;
  for (var i = 0; i < meals.length; i++) {
    var arr = dd[meals[i]];
    for (var j = 0; j < arr.length; j++) {
      total++;
      var info = getFoodInfo(arr[j]);
      if (info) for (var t = 0; t < info.t.length; t++) counts[info.t[t]] = (counts[info.t[t]] || 0) + 1;
    }
  }
  if (total === 0) return null;
  return { counts: counts, total: total };
}
function calcGrade(a) {
  if (!a || a.total === 0) return null;
  var c = a.counts;
  var bad = c.gout + c.salt * 0.7 + c.fat * 0.7 + c.proc * 0.5 + c.alc * 1.5;
  var net = (c.good + c.protein * 0.5) - bad;
  if (c.alc >= 1 && c.gout >= 2) return 'F';
  if (net >= 4) return 'A';
  if (net >= 2) return 'B';
  if (net >= 0) return 'C';
  if (net >= -3) return 'D';
  return 'F';
}
var GRADE_MSG = {
  A:'훌륭한 구성이에요.', B:'괜찮습니다. 한두 가지만 조심하면 더 좋겠어요.',
  C:'평범한 하루. 단백질과 채소를 한 번 더 챙겨보세요.',
  D:'오늘은 회복에 도움이 덜 되는 구성이었어요. 다음 한 끼만 바꿔봐요.',
  F:'통풍 쪽으로 부담이 큰 조합입니다. 물을 충분히 드시고 다음 끼니를 가볍게.'
};
function getInsights(a) {
  if (!a) return [];
  var c = a.counts, ins = [];
  if (c.alc >= 1 && c.gout >= 1) ins.push({ t:'bad', x:'⚠️ <b>술 + 고퓨린 조합</b> — 요산 배출이 막힙니다. 물을 충분히 드세요.' });
  else if (c.alc >= 1) ins.push({ t:'bad', x:'🍺 음주 기록 — 회복과 수면의 질에 직접 영향을 줍니다.' });
  else if (c.gout >= 3) ins.push({ t:'warn', x:'⚠️ 고퓨린 식품 ' + c.gout + '회 — 물 2L 이상 챙기세요.' });
  if (c.salt >= 4) ins.push({ t:'bad', x:'🧂 <b>나트륨 ' + c.salt + '회</b> — 다음 끼니는 국·찌개를 빼보세요.' });
  else if (c.salt >= 2) ins.push({ t:'warn', x:'🧂 나트륨 ' + c.salt + '회 — 국물은 건더기만.' });
  if (c.fat >= 3) ins.push({ t:'warn', x:'🥓 포화지방 ' + c.fat + '회 — 내일은 닭가슴살·생선·두부로.' });
  if (c.good >= 5) ins.push({ t:'good', x:'✅ <b>도움 식품 ' + c.good + '회</b> — 아주 좋은 흐름이에요.' });
  if (c.protein === 0 && a.total >= 4) ins.push({ t:'warn', x:'🥚 단백질이 비었어요 — 달걀이라도 하나.' });
  if (ins.length === 0) ins.push({ t:'neutral', x:'특별한 신호 없는 하루예요.' });
  return ins;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

var MEAL_META = [
  { k:'b', icon:'🌅', label:'아침', free:'breakfast' },
  { k:'l', icon:'☀️', label:'점심', free:'lunch' },
  { k:'d', icon:'🌙', label:'저녁', free:'dinner' }
];

function render() {
  var t = todayDate();
  var dayText;
  if (dateKey(currentDate) === dateKey(t)) dayText = '오늘';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()-1))) dayText = '어제';
  else dayText = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일';
  document.getElementById('date-text').firstChild.nodeValue = dayText;
  document.getElementById('date-sub').textContent =
    (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일 (' + WEEK_DAYS[currentDate.getDay()] + ')';

  document.getElementById('week-tag').textContent = weekLetter(currentDate) + '주';

  renderScore();
  renderMeals();
  renderFlags();
  renderExceptions();
  renderFree();
}

function renderScore() {
  var pct = dayScore(currentDate);
  var el = document.getElementById('score-num');
  var v = (pct === null) ? 0 : pct;
  el.innerHTML = v + '<span class="pct">%</span>';
  el.className = 'score-num' + (v >= 80 ? '' : (v >= 40 ? ' mid' : ' low'));
  document.getElementById('score-fill').style.width = v + '%';
  var m = scoreMessage(pct);
  var msgEl = document.getElementById('score-msg');
  msgEl.textContent = m.msg;
  msgEl.className = 'score-msg ' + m.cls;
}

function renderMeals() {
  var p = planFor(currentDate);
  var dd = dayDataOf(currentDate);
  var html = '';

  for (var i = 0; i < MEAL_META.length; i++) {
    var mm = MEAL_META[i];
    var meal = p[mm.k];
    var cur = dd.plan[mm.k] || '';
    var isFree = (meal.carb === 'free');
    var done = (cur === 'ok' || cur === 'alt' || cur === 'school');

    html += '<div class="meal-card' + (isFree ? ' free' : (done ? ' done' : '')) + '">';
    html += '<div class="meal-head"><div class="meal-title">' + mm.icon + ' ' + mm.label + '</div>';
    if (meal.carb) html += '<span class="carb-tag ' + meal.carb + '">' + CARB_LABEL[meal.carb] + '</span>';
    else if (meal.box) html += '<span class="carb-tag box">도시락 또는 학식</span>';
    html += '</div>';

    html += '<div class="meal-menu">' + esc(meal.menu) + '</div>';
    if (meal.k6) html += '<div class="meal-note kid">🧒 <b>6세</b> · ' + esc(meal.k6) + '</div>';
    if (meal.k2) html += '<div class="meal-note kid2">👶 <b>2세</b> · ' + esc(meal.k2) + '</div>';
    if (meal.adult) html += '<div class="meal-note adult">💪 <b>어른</b> · ' + esc(meal.adult) + '</div>';
    if (meal.alt) html += '<div class="meal-note">↺ 대체 · ' + esc(meal.alt) + '</div>';

    html += '<div class="pick-row">';
    if (mm.k === 'l' && meal.box) {
      html += '<button class="pick-btn' + (cur === 'box' ? ' on' : '') + '" onclick="pickMeal(\'l\',\'box\')">🍱 도시락</button>';
      html += '<button class="pick-btn school' + (cur === 'school' ? ' on school' : '') + '" onclick="pickMeal(\'l\',\'school\')">🏫 학식</button>';
    } else {
      html += '<button class="pick-btn' + (cur === 'ok' ? ' on' : '') + '" onclick="pickMeal(\'' + mm.k + '\',\'ok\')">✓ 계획대로</button>';
    }
    html += '<button class="pick-btn' + (cur === 'alt' ? ' on' : '') + '" onclick="pickMeal(\'' + mm.k + '\',\'alt\')">↺ 다른 걸로</button>';
    html += '<button class="pick-btn skip' + (cur === 'skip' ? ' on skip' : '') + '" onclick="pickMeal(\'' + mm.k + '\',\'skip\')">– 거름</button>';
    html += '</div>';

    if (mm.k === 'l' && cur === 'school') {
      html += '<div class="l3-box"><div class="l3-title">🍱 학식에서 지킬 3가지</div>';
      for (var j = 0; j < L3.length; j++) {
        var c = L3[j], on = !!dd.l3[c.k];
        html += '<div class="check-row' + (on ? ' done' : '') + '" onclick="toggleL3(\'' + c.k + '\')">';
        html += '<div class="checkbox' + (on ? ' done' : '') + '"></div>';
        html += '<div class="check-text">' + c.label + '<span class="sub">' + c.sub + '</span></div></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  document.getElementById('meal-cards').innerHTML = html;
}

function renderFlags() {
  var dd = dayDataOf(currentDate);
  var w = document.getElementById('mini-water');
  var m = document.getElementById('mini-med');
  if (dd.water) w.classList.add('on'); else w.classList.remove('on');
  if (dd.med) m.classList.add('on'); else m.classList.remove('on');
}

function renderExceptions() {
  var dd = dayDataOf(currentDate);
  var html = '';
  for (var i = 0; i < EXCEPTIONS.length; i++) {
    var e = EXCEPTIONS[i];
    var on = dd.exc.indexOf(e.k) >= 0;
    html += '<button class="exc-chip' + (on ? ' on' : '') + '" onclick="toggleExc(\'' + e.k + '\')">' + e.label + '</button>';
  }
  document.getElementById('exc-chips').innerHTML = html;
  var n = dd.exc.length;
  document.getElementById('exc-meta').textContent = (n === 0 ? '없음' : n + '개') + ' ▾';
}

function renderFree() {
  var dd = dayDataOf(currentDate);
  var a = analyzeDay(currentDate);
  var g = calcGrade(a);
  var line = document.getElementById('grade-line');
  if (g) {
    line.style.display = '';
    var b = document.getElementById('free-grade');
    b.textContent = g; b.className = 'grade-badge ' + g;
    document.getElementById('free-grade-txt').textContent = GRADE_MSG[g];
  } else line.style.display = 'none';

  var html = '';
  var meals = [['breakfast','🌅 아침'],['lunch','☀️ 점심'],['dinner','🌙 저녁'],['snack','🍪 간식·음료']];
  for (var i = 0; i < meals.length; i++) {
    var key = meals[i][0], arr = dd[key];
    html += '<div class="sub-label">' + meals[i][1] + '</div>';
    html += '<div class="chip-area' + (arr.length ? '' : ' empty') + '">';
    for (var j = 0; j < arr.length; j++) {
      var info = getFoodInfo(arr[j]);
      var cls = '';
      if (info) {
        if (info.t.indexOf('alc') >= 0 || info.t.indexOf('gout') >= 0) cls = 'danger';
        else if (info.t.indexOf('salt') >= 0 || info.t.indexOf('fat') >= 0 || info.t.indexOf('proc') >= 0) cls = 'warn';
        else if (info.t.indexOf('good') >= 0) cls = 'good';
      }
      html += '<span class="chip ' + cls + '">' + esc(arr[j]) +
              '<button class="chip-x" onclick="removeFood(\'' + key + '\',' + j + ')">✕</button></span>';
    }
    html += '</div>';
    html += '<button class="add-food-btn" onclick="openModal(\'' + key + '\')">+ 음식 추가</button>';
  }
  document.getElementById('free-meals').innerHTML = html;

  var ins = getInsights(a), ih = '';
  for (var i = 0; i < ins.length; i++) ih += '<div class="insight-row ' + ins[i].t + '">' + ins[i].x + '</div>';
  document.getElementById('free-insights').innerHTML = a ? ih : '';
}

// ═══════════════════════════════════════════
// 액션
// ═══════════════════════════════════════════
function syncPct() {
  var k = dateKey(currentDate);
  if (!store.dates[k]) return;
  var s = dayScore(currentDate);
  store.dates[k].pct = (s === null) ? 0 : s;
  saveStore(store);
}

function pickMeal(mealKey, val) {
  var dd = getDayData();
  if (dd.plan[mealKey] === val) delete dd.plan[mealKey];
  else dd.plan[mealKey] = val;
  saveStore(store);
  syncPct();
  renderScore(); renderMeals();
}
function toggleL3(k) {
  var dd = getDayData();
  dd.l3[k] = !dd.l3[k];
  saveStore(store);
  syncPct();
  renderScore(); renderMeals();
}
function toggleFlag(k) {
  var dd = getDayData();
  dd[k] = !dd[k];
  saveStore(store);
  syncPct();
  renderScore(); renderFlags();
}
function toggleExc(k) {
  var dd = getDayData();
  var i = dd.exc.indexOf(k);
  if (i >= 0) dd.exc.splice(i, 1); else dd.exc.push(k);
  saveStore(store);
  renderExceptions();
}
function toggleFold(which) {
  var body = document.getElementById('fold-' + which);
  body.style.display = (body.style.display === 'none') ? 'block' : 'none';
}
function removeFood(meal, idx) {
  var dd = getDayData();
  if (!dd[meal]) return;
  dd[meal].splice(idx, 1);
  saveStore(store);
  renderFree();
}
function addFood(name) {
  var dd = getDayData();
  if (!dd[currentMeal]) dd[currentMeal] = [];
  dd[currentMeal].push(name);
  saveStore(store);
  renderFree();
}

// ═══════════════════════════════════════════
// 모달 — 검색 + 직접 추가
// ═══════════════════════════════════════════
var currentMeal = 'breakfast';
var currentCategory = '전체';
var customTags = {};
var MEAL_LABEL = { breakfast:'🌅 아침', lunch:'☀️ 점심', dinner:'🌙 저녁', snack:'🍪 간식' };

function categories() {
  var seen = {}, out = [];
  var arr = allFoods();
  for (var i = 0; i < arr.length; i++) if (!seen[arr[i].c]) { seen[arr[i].c] = 1; out.push(arr[i].c); }
  return out;
}
function openModal(meal) {
  currentMeal = meal;
  currentCategory = '전체';
  customTags = {};
  document.getElementById('modal-meal-label').textContent = '· ' + MEAL_LABEL[meal];
  document.getElementById('search-input').value = '';
  document.getElementById('custom-name').value = '';
  renderCatTabs(); renderFoodList(); renderCustomTags();
  document.getElementById('modal-overlay').classList.add('on');
  document.body.style.overflow = 'hidden';
  enableKeyboardHandler();
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('on');
  document.body.style.overflow = '';
  disableKeyboardHandler();
  var si = document.getElementById('search-input'); if (si) si.blur();
}
function closeModalIfOverlay(e) { if (e.target.id === 'modal-overlay') closeModal(); }

function renderCatTabs() {
  var cats = categories();
  var html = '<button class="cat-tab' + (currentCategory === '전체' ? ' on' : '') + '" onclick="selectCat(\'전체\')">전체</button>';
  html += '<button class="cat-tab' + (currentCategory === '내 음식' ? ' on' : '') + '" onclick="selectCat(\'내 음식\')">⭐ 내 음식</button>';
  for (var i = 0; i < cats.length; i++)
    html += '<button class="cat-tab' + (currentCategory === cats[i] ? ' on' : '') + '" onclick="selectCat(\'' + jsq(cats[i]) + '\')">' + esc(cats[i]) + '</button>';
  document.getElementById('cat-tabs').innerHTML = html;
}
function selectCat(c) { currentCategory = c; renderCatTabs(); renderFoodList(); }

function renderFoodList() {
  var q = document.getElementById('search-input').value.trim().toLowerCase();
  var arr = (currentCategory === '내 음식') ? (store.myFoods || []) : allFoods();
  var html = '';
  for (var i = 0; i < arr.length; i++) {
    var f = arr[i];
    if (currentCategory !== '전체' && currentCategory !== '내 음식' && f.c !== currentCategory) continue;
    if (q && f.n.toLowerCase().indexOf(q) < 0) continue;
    var tags = '';
    for (var j = 0; j < f.t.length; j++) tags += '<span class="tag ' + f.t[j] + '">' + TAG_LABEL[f.t[j]] + '</span>';
    html += '<div class="food-item" onclick="addFood(\'' + jsq(f.n) + '\');closeModal()">';
    html += '<div><div class="food-name">' + esc(f.n) + '</div>';
    if (tags) html += '<div class="food-tags">' + tags + '</div>';
    html += '</div><button class="food-add-btn">+</button></div>';
  }
  if (!html) html = '<div class="empty-state">검색 결과가 없어요<br><span style="font-size:11px">아래에서 직접 추가할 수 있습니다</span></div>';
  var el = document.getElementById('food-list');
  el.innerHTML = html; el.scrollTop = 0;
}
function filterFoods() { renderFoodList(); }

function renderCustomTags() {
  var html = '';
  for (var i = 0; i < TAG_ORDER.length; i++) {
    var k = TAG_ORDER[i];
    var on = !!customTags[k];
    html += '<button class="tag pick ' + (on ? k + ' on' : '') + '" onclick="toggleCustomTag(\'' + k + '\')">' +
            (on ? '✓ ' : '') + TAG_LABEL[k] + '</button>';
  }
  document.getElementById('custom-tags').innerHTML = html;
}
function toggleCustomTag(k) { customTags[k] = !customTags[k]; renderCustomTags(); }

function saveCustomFood() {
  var name = document.getElementById('custom-name').value.trim();
  if (!name) { window.alert('음식 이름을 입력해 주세요'); return; }
  var t = [];
  for (var i = 0; i < TAG_ORDER.length; i++) if (customTags[TAG_ORDER[i]]) t.push(TAG_ORDER[i]);
  if (!store.myFoods) store.myFoods = [];
  var exists = false;
  for (var i = 0; i < store.myFoods.length; i++) if (store.myFoods[i].n === name) { exists = true; break; }
  if (!exists) store.myFoods.push({ c:'내 음식', n:name, t:t });
  saveStore(store);
  addFood(name);
  closeModal();
}

// 키보드 대응
function handleViewportResize() {
  if (!window.visualViewport) return;
  var vv = window.visualViewport;
  var keyboardH = Math.max(0, window.innerHeight - vv.height);
  var root = document.documentElement;
  if (keyboardH > 100) {
    root.style.setProperty('--modal-h', Math.floor(vv.height * 0.9) + 'px');
    root.style.setProperty('--modal-offset', '-' + keyboardH + 'px');
  } else {
    root.style.setProperty('--modal-h', '78vh');
    root.style.setProperty('--modal-offset', '0px');
  }
}
function enableKeyboardHandler() {
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportResize);
    window.visualViewport.addEventListener('scroll', handleViewportResize);
  }
}
function disableKeyboardHandler() {
  if (window.visualViewport) {
    window.visualViewport.removeEventListener('resize', handleViewportResize);
    window.visualViewport.removeEventListener('scroll', handleViewportResize);
  }
  document.documentElement.style.setProperty('--modal-h', '78vh');
  document.documentElement.style.setProperty('--modal-offset', '0px');
}
function onSearchFocus() { setTimeout(handleViewportResize, 100); setTimeout(handleViewportResize, 350); }
function onSearchBlur() { setTimeout(handleViewportResize, 100); }

// ═══════════════════════════════════════════
// 날짜 이동 / 뷰
// ═══════════════════════════════════════════
function changeDate(delta) {
  var d = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + delta);
  if (d < PLAN_START) return;
  if (d > todayDate()) return;
  currentDate = d;
  render();
}

function switchView(v) {
  var ids = ['day','week','plan'];
  for (var i = 0; i < ids.length; i++) {
    document.getElementById('view-' + ids[i]).style.display = (ids[i] === v) ? '' : 'none';
    var b = document.getElementById('v-' + ids[i] + '-btn');
    if (ids[i] === v) b.classList.add('on'); else b.classList.remove('on');
  }
  if (v === 'week') renderWeekly();
  if (v === 'plan') renderPlanView();
  window.scrollTo(0, 0);
}

function renderWeekly() {
  var t = todayDate();
  var html = '', sum = 0, n = 0;
  for (var i = 6; i >= 0; i--) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var pct = dayScore(d);
    var label = (i === 0) ? '오늘' : (i === 1 ? '어제' : (d.getMonth()+1) + '/' + d.getDate());
    if (pct !== null) { sum += pct; n++; }
    html += '<div class="weekly-row"><div class="weekly-day">' + label + '</div>';
    html += '<div class="weekly-bar-track">';
    if (pct) html += '<div class="weekly-bar-fill" style="width:' + pct + '%"></div>';
    html += '</div><div class="weekly-pct">' + (pct === null ? '—' : pct + '%') + '</div></div>';
  }
  html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--c-border);font-size:12px;color:var(--c-muted)">' +
          '7일 평균 <b style="color:var(--c-accent)">' + (n ? Math.round(sum/n) + '%' : '—') + '</b> · 기록한 날 ' + n + '일</div>';
  document.getElementById('weekly-list').innerHTML = html;

  // 예외 집계
  var cnt = {};
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var ex = dayDataOf(d).exc;
    for (var j = 0; j < ex.length; j++) cnt[ex[j]] = (cnt[ex[j]] || 0) + 1;
  }
  var eh = '', any = false;
  for (var i = 0; i < EXCEPTIONS.length; i++) {
    var e = EXCEPTIONS[i];
    if (!cnt[e.k]) continue;
    any = true;
    eh += '<div class="weekly-row"><div class="weekly-day" style="width:auto;-webkit-flex:1;flex:1;font-size:12px">' +
          e.label + '</div><div class="weekly-pct">' + cnt[e.k] + '회</div></div>';
  }
  document.getElementById('weekly-exc').innerHTML = any ? eh :
    '<div class="empty-state">기록된 예외가 없어요</div>';

  // 습관
  var w = 0, m = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var dd = dayDataOf(d);
    if (dd.water) w++;
    if (dd.med) m++;
  }
  document.getElementById('weekly-habit').innerHTML =
    '<div class="weekly-row"><div class="weekly-day" style="width:auto;-webkit-flex:1;flex:1;font-size:12px">💧 물 2L</div><div class="weekly-pct">' + w + '/7일</div></div>' +
    '<div class="weekly-row"><div class="weekly-day" style="width:auto;-webkit-flex:1;flex:1;font-size:12px">💊 약 복용</div><div class="weekly-pct">' + m + '/7일</div></div>';
}

var planWeekShown = null;
function showPlanWeek(w) {
  planWeekShown = w;
  document.getElementById('pw-A').classList.toggle('on', w === 'A');
  document.getElementById('pw-B').classList.toggle('on', w === 'B');
  document.getElementById('plan-title').textContent = w + '주 식단표';
  var order = [1,2,3,4,5,6,0];
  var html = '<tr><th></th><th>아침</th><th>점심</th><th>저녁</th></tr>';
  var todayDow = todayDate().getDay();
  var isCurWeek = (weekLetter(todayDate()) === w);
  for (var i = 0; i < order.length; i++) {
    var dow = order[i], p = PLAN[w][dow];
    var cls = (isCurWeek && dow === todayDow) ? ' class="today-row"' : '';
    html += '<tr' + cls + '><td class="dow">' + WEEK_DAYS[dow] + '</td>';
    html += '<td>' + esc(p.b.menu) + '</td>';
    html += '<td>' + (p.l.box ? '🍱 ' : '') + esc(p.l.menu) + (p.l.box ? '<br><span style="color:var(--c-muted);font-size:10px">또는 학식</span>' : '') + '</td>';
    html += '<td>' + esc(p.d.menu) + (p.d.carb ? '<br><span style="color:var(--c-muted);font-size:10px">' + CARB_LABEL[p.d.carb] + '</span>' : '') + '</td>';
    html += '</tr>';
  }
  document.getElementById('plan-table').innerHTML = html;
}
function renderPlanView() {
  document.getElementById('plan-principle').innerHTML = PRINCIPLE_TEXT;
  if (!planWeekShown) planWeekShown = weekLetter(todayDate());
  showPlanWeek(planWeekShown);
  var lh = '';
  for (var i = 0; i < L3.length; i++)
    lh += '<div class="meal-note" style="margin-bottom:6px"><b>' + (i+1) + '. ' + L3[i].label + '</b><br>' + L3[i].sub + '</div>';
  lh += '<div class="exc-note">대학원 수업이 있는 날은 도시락, 아닌 날은 학식. 학식은 통제하기 어려운 끼니라 메뉴를 정하는 대신 <b>고르는 법</b>만 지키면 충분합니다.</div>';
  document.getElementById('l3-guide').innerHTML = lh;
  var sh = '';
  for (var i = 0; i < SAFETY.length; i++)
    sh += '<div class="safety-item"><b class="h">' + SAFETY[i].t + '</b>' + SAFETY[i].x + '</div>';
  sh += '<div class="exc-note">연령별 식이·알레르기 판단은 소아과 진료 범위입니다. 위 내용은 일반적인 주의사항이니 아이 상태에 맞게 조정하세요.</div>';
  document.getElementById('safety-guide').innerHTML = sh;
}

function goHome() { window.location.href = 'index.html'; }

render();
