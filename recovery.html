<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회복 루틴 → 운동 기록으로 이동</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#12100e;color:#e8e4dc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:20px}
  .box{max-width:340px}
  h1{font-size:19px;margin-bottom:10px}
  p{font-size:14px;color:#a99;line-height:1.6;margin-bottom:20px}
  a{display:inline-block;background:linear-gradient(135deg,#B8412A,#D45438);color:#fff;text-decoration:none;padding:13px 24px;border-radius:12px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="box">
  <h1>🩹 회복 루틴이 통합되었습니다</h1>
  <p>회복기 운동은 이제 <strong>운동 기록</strong> 페이지에서 시기(국면)에 맞춰 자동으로 표시됩니다. 별도 회복 페이지는 더 이상 필요하지 않아요.</p>
  <a href="workout.html">운동 기록으로 이동 →</a>
</div>
<script>
  // 기존 회복 데이터(aokc2026_recovery)를 workout 통계로 1회 이관 (있으면)
  try {
    var rec = JSON.parse(localStorage.getItem('aokc2026_recovery') || 'null');
    var wk = JSON.parse(localStorage.getItem('aokc2026_workout') || '{"dates":{}}');
    if (rec && rec.dates) {
      var changed = false;
      for (var k in rec.dates) {
        var r = rec.dates[k];
        var active = false;
        if (r.ex) { for (var i in r.ex) if (r.ex[i]) active = true; }
        if (r.addon) { for (var a in r.addon) if (r.addon[a]) active = true; }
        if (active) {
          if (!wk.dates) wk.dates = {};
          if (!wk.dates[k]) wk.dates[k] = {};
          if (!wk.dates[k].recovery) { wk.dates[k].recovery = true; changed = true; }
        }
      }
      if (changed) localStorage.setItem('aokc2026_workout', JSON.stringify(wk));
    }
  } catch(e) {}
  // 2초 후 자동 이동
  setTimeout(function(){ window.location.href = 'workout.html'; }, 2500);
</script>
</body>
</html>
