<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동 기록">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon" sizes="360x360" href="icon-360.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#B8412A">
<title>운동 기록 — AOKC 2026</title>
<style>
:root {
  --c-bg: #F5F2EA;
  --c-surface: #FFFFFF;
  --c-surface-2: #FAF8F2;
  --c-border: #E0DCCF;
  --c-text: #1A1916;
  --c-muted: #7A7468;
  --c-accent: #0F4C36;
  --c-accent-2: #1D6B47;
  --c-accent-light: #DCE9E1;
  --c-amber: #B57318;
  --c-amber-light: #F8EBCF;
  --c-coral: #B8412A;
  --c-coral-2: #D45438;
  --c-coral-light: #F8E2DA;
  --c-blue: #1A5CA0;
  --c-blue-light: #DEEAF7;
  --c-purple: #5C3DAF;
  --c-purple-light: #E8E2F5;
  --c-good: #2D7A4E;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  padding-bottom: calc(20px + var(--safe-bottom));
}

/* 헤더 */
.header {
  background: -webkit-linear-gradient(180deg, #B8412A 0%, #D45438 100%);
  background: linear-gradient(180deg, #B8412A 0%, #D45438 100%);
  color: #fff;
  padding: 16px 18px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-row {
  display: -webkit-flex;
  display: flex;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-align-items: center;
  align-items: center;
}
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.back-btn {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.content { padding: 14px; }

/* 토글 */
.toggle-section {
  display: -webkit-flex;
  display: flex;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 12px;
}
.toggle-btn {
  -webkit-flex: 1;
  flex: 1;
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--c-muted);
  cursor: pointer;
  font-family: inherit;
}
.toggle-btn.on {
  background: var(--c-surface);
  color: var(--c-text);
  -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* 날짜 바 */
.date-bar {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.date-btn {
  background: var(--c-coral-light);
  color: var(--c-coral);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.date-text { font-size: 14px; font-weight: 700; }
.date-text .sub {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--c-muted);
  margin-top: 2px;
}

/* 루틴 배지 (오늘의 루틴 라벨) */
.routine-badge {
  display: -webkit-inline-flex;
  display: inline-flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.routine-badge.A { background: var(--c-coral-light); color: var(--c-coral); }
.routine-badge.B { background: var(--c-blue-light); color: var(--c-blue); }
.routine-badge.M { background: var(--c-accent-light); color: var(--c-accent); }
.routine-badge.S { background: var(--c-amber-light); color: #6B5510; }

/* 루틴 선택기 */
.routine-picker {
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 12px;
}
.routine-picker-label {
  font-size: 11px;
  color: var(--c-muted);
  margin-bottom: 8px;
  line-height: 1.4;
}
.routine-picker-label strong { color: var(--c-coral); font-weight: 700; }
.routine-picker-btns {
  display: -webkit-flex;
  display: flex;
  gap: 6px;
}
.rp-btn {
  -webkit-flex: 1;
  flex: 1;
  padding: 9px 4px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
  background: var(--c-surface);
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  color: var(--c-muted);
  cursor: pointer;
  font-family: inherit;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
}
.rp-btn:active { -webkit-transform: scale(0.96); transform: scale(0.96); }
.rp-btn.on {
  background: var(--c-coral);
  border-color: var(--c-coral);
  color: #fff;
}

/* 진행 바 */
.progress-wrap {
  background: var(--c-border);
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 4px;
}
.progress-fill {
  height: 100%;
  background: -webkit-linear-gradient(left, var(--c-coral), var(--c-coral-2));
  background: linear-gradient(90deg, var(--c-coral), var(--c-coral-2));
  -webkit-transition: width 0.3s;
  transition: width 0.3s;
  border-radius: 4px;
}
.progress-text {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--c-coral);
  margin-bottom: 14px;
}

/* 카드 */
.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  gap: 6px;
}
.card-title-text {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 6px;
}
.card-sub {
  font-size: 11px;
  color: var(--c-muted);
  margin-top: -4px;
  margin-bottom: 10px;
}

/* 운동 체크 항목 */
.workout-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: flex-start;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.workout-row:last-child { border-bottom: none; }
.checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--c-muted);
  border-radius: 6px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  margin-right: 11px;
  margin-top: 1px;
  position: relative;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
  background: #fff;
}
.checkbox.done {
  background: var(--c-coral);
  border-color: var(--c-coral);
}
.checkbox.done:after {
  content: '';
  position: absolute;
  left: 5px;
  top: 1px;
  width: 6px;
  height: 11px;
  border: solid #fff;
  border-width: 0 2.5px 2.5px 0;
  -webkit-transform: rotate(45deg);
  transform: rotate(45deg);
}
.workout-content {
  -webkit-flex: 1;
  flex: 1;
}
.workout-num {
  display: inline-block;
  width: 18px;
  height: 18px;
  background: var(--c-surface-2);
  color: var(--c-muted);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  line-height: 18px;
  border-radius: 4px;
  margin-right: 6px;
  vertical-align: middle;
}
.workout-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
  line-height: 1.4;
  display: inline;
}
.workout-row.done .workout-name {
  color: var(--c-muted);
  text-decoration: line-through;
}
.workout-detail {
  font-size: 11px;
  color: var(--c-muted);
  margin-top: 3px;
  margin-left: 24px;
  line-height: 1.4;
}
.workout-target {
  display: inline-block;
  background: var(--c-coral-light);
  color: var(--c-coral);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  margin-left: 4px;
  vertical-align: middle;
}
.workout-target.B { background: var(--c-blue-light); color: var(--c-blue); }
.workout-target.M { background: var(--c-accent-light); color: var(--c-accent); }
.workout-target.S { background: var(--c-amber-light); color: #6B5510; }
.workout-target.C { background: var(--c-purple-light); color: var(--c-purple); }

/* 단순 옵션 그리드 (유산소·스트레칭·휴식·코프볼) */
.option-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.option-btn {
  background: var(--c-surface-2);
  border: 1.5px solid var(--c-border);
  padding: 14px 8px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.option-btn:active { -webkit-transform: scale(0.97); transform: scale(0.97); }
.option-btn.on {
  background: var(--c-coral-light);
  border-color: var(--c-coral);
}
.option-btn.on .opt-check { display: -webkit-inline-flex; display: inline-flex; }
.option-icon {
  font-size: 22px;
  display: block;
  margin-bottom: 4px;
}
.option-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-text);
}
.option-sub {
  font-size: 10px;
  color: var(--c-muted);
  margin-top: 2px;
}
.opt-check {
  display: none;
  width: 18px;
  height: 18px;
  background: var(--c-coral);
  color: #fff;
  border-radius: 50%;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  margin-top: 6px;
  margin-left: auto;
  margin-right: auto;
}

/* 메모 */
.memo-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--c-border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  resize: vertical;
  min-height: 70px;
  line-height: 1.5;
}
.memo-input:focus { outline: none; border-color: var(--c-coral); }

/* 저장 표시 */
.save-indicator {
  font-size: 11px;
  font-weight: 600;
  -webkit-transition: opacity 0.3s ease;
  transition: opacity 0.3s ease;
  opacity: 0;
  white-space: nowrap;
}
.save-indicator.show { opacity: 1; }
.save-indicator.saving { color: var(--c-muted); }
.save-indicator.saved { color: var(--c-good); }

/* 요약 */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.summary-box {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.summary-num {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--c-coral);
}
.summary-num.gold { color: #B8923A; }
.summary-lbl {
  font-size: 10px;
  color: var(--c-muted);
  margin-top: 4px;
  font-weight: 600;
}

/* 주간 뷰 */
.weekly-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 12px;
}
.weekly-day {
  width: 60px;
  font-weight: 600;
  color: var(--c-muted);
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  font-size: 11px;
}
.weekly-bar-track {
  -webkit-flex: 1;
  flex: 1;
  height: 18px;
  background: var(--c-surface-2);
  border-radius: 4px;
  overflow: hidden;
}
.weekly-bar-fill {
  height: 100%;
  background: -webkit-linear-gradient(left, var(--c-coral), var(--c-coral-2));
  background: linear-gradient(90deg, var(--c-coral), var(--c-coral-2));
  -webkit-transition: width 0.3s;
  transition: width 0.3s;
}
.weekly-pct {
  width: 36px;
  text-align: right;
  font-weight: 700;
  font-size: 12px;
  color: var(--c-coral);
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.weekly-label {
  font-size: 10px;
  color: var(--c-muted);
  width: 30px;
  text-align: right;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}

.empty-state {
  text-align: center;
  padding: 24px 16px;
  color: var(--c-muted);
  font-size: 12.5px;
  line-height: 1.6;
}

.btn-secondary {
  width: 100%;
  background: transparent;
  border: 1px solid var(--c-border);
  padding: 11px;
  border-radius: 10px;
  color: var(--c-muted);
  font-size: 13px;
  font-weight: 500;
  margin-top: 6px;
  cursor: pointer;
  font-family: inherit;
}

/* 정보 박스 */
.info-box {
  background: var(--c-coral-light);
  border: 1px solid #E8B6A8;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 11.5px;
  color: #6B1E0E;
  line-height: 1.5;
  margin-bottom: 12px;
}
.info-box strong { font-weight: 700; }

</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>🏋️ 운동 기록</h1>
      <p>오늘의 홈 워크아웃을 체크</p>
    </div>
    <button class="back-btn" onclick="goHome()">← 메인</button>
  </div>
</div>

<div class="content">

  <!-- 🩹 임시 회복 루틴 진입 카드 (엄지 부상 회복기 종료 후 이 블록만 삭제하면 원상복구) -->
  <a href="recovery.html" style="display:block;text-decoration:none;background:-webkit-linear-gradient(135deg,#B8412A,#D45438);background:linear-gradient(135deg,#B8412A,#D45438);color:#fff;padding:14px 16px;border-radius:14px;margin-bottom:14px;-webkit-box-shadow:0 2px 8px rgba(184,65,42,0.25);box-shadow:0 2px 8px rgba(184,65,42,0.25)">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:26px;line-height:1">🩹</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:15px;margin-bottom:2px">임시 회복 루틴 (엄지 부상)</div>
        <div style="font-size:12px;opacity:0.9">반깁스 2~3주 · 엄지 보호 홈 워크아웃 · 본 통계와 분리</div>
      </div>
      <div style="font-size:20px;opacity:0.8">›</div>
    </div>
  </a>

  <div class="toggle-section">
    <button class="toggle-btn on" id="view-day-btn" onclick="switchView('day')">📅 오늘</button>
    <button class="toggle-btn" id="view-week-btn" onclick="switchView('week')">📊 주간</button>
  </div>

  <!-- 일별 -->
  <div id="view-day">

    <div class="date-bar">
      <button class="date-btn" onclick="changeDate(-1)">‹</button>
      <div class="date-text" id="date-text">오늘
        <span class="sub" id="date-sub"></span>
      </div>
      <button class="date-btn" onclick="changeDate(1)">›</button>
    </div>

    <!-- 오늘 루틴 안내 -->
    <div class="info-box" id="today-info"></div>

    <!-- 요약 -->
    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-num" id="sum-today">0%</div>
        <div class="summary-lbl">루틴 달성</div>
      </div>
      <div class="summary-box">
        <div class="summary-num gold" id="sum-streak">0</div>
        <div class="summary-lbl">연속 일수</div>
      </div>
      <div class="summary-box">
        <div class="summary-num" id="sum-week">0</div>
        <div class="summary-lbl">7일 운동</div>
      </div>
    </div>

    <!-- 진행 -->
    <div class="progress-wrap">
      <div class="progress-fill" id="prog-bar" style="width:0%"></div>
    </div>
    <div class="progress-text" id="prog-text">0/0 항목 완료</div>

    <!-- 오늘의 루틴 카드 -->
    <div class="card" id="routine-card">
      <div class="card-title">
        <span class="card-title-text" id="routine-title">🏋️ 오늘의 루틴</span>
        <span class="routine-badge" id="routine-badge"></span>
      </div>
      <div class="card-sub" id="routine-sub"></div>

      <!-- 루틴 선택 -->
      <div class="routine-picker">
        <div class="routine-picker-label" id="routine-picker-label">오늘 추천: <strong id="rec-routine"></strong> · 다른 루틴으로 바꿀 수 있어요</div>
        <div class="routine-picker-btns">
          <button class="rp-btn" id="rp-A" onclick="pickRoutine('A')">A · 폭발력</button>
          <button class="rp-btn" id="rp-B" onclick="pickRoutine('B')">B · 근력</button>
          <button class="rp-btn" id="rp-M" onclick="pickRoutine('M')">모빌리티</button>
          <button class="rp-btn" id="rp-S" onclick="pickRoutine('S')">가벼운<br>스트레칭</button>
        </div>
      </div>

      <div id="routine-items"></div>
    </div>

    <!-- 쿨다운 카드 (A·B 루틴 일에만) -->
    <div class="card" id="cooldown-card" style="display:none">
      <div class="card-title">
        <span class="card-title-text">🧘 운동 직후 쿨다운</span>
        <span class="routine-badge S">필수</span>
      </div>
      <div class="card-sub">A·B 루틴 끝나고 바로 (월·화·목·금)</div>
      <div id="cooldown-items"></div>
    </div>

    <!-- 추가 활동 -->
    <div class="card">
      <div class="card-title">
        <span class="card-title-text">➕ 추가 활동</span>
      </div>
      <div class="card-sub">홈 워크아웃 외 추가로 한 운동</div>
      <div class="option-grid">
        <button class="option-btn" id="opt-cardio" onclick="toggleOpt('cardio')">
          <span class="option-icon">🏃‍♂️</span>
          <div class="option-label">유산소</div>
          <div class="option-sub">러닝·자전거</div>
          <div class="opt-check">✓</div>
        </button>
        <button class="option-btn" id="opt-stretch" onclick="toggleOpt('stretch')">
          <span class="option-icon">🧘</span>
          <div class="option-label">스트레칭</div>
          <div class="option-sub">추가 회복</div>
          <div class="opt-check">✓</div>
        </button>
        <button class="option-btn" id="opt-korfball" onclick="toggleOpt('korfball')">

<script>
// ═══════════════════════════════════════════
// 루틴 정의 — PDF 기준
// ═══════════════════════════════════════════
var ROUTINE_A = {

  items: [
    { k: 'a1', name: '익스플로시브 스텝업', target: '양발 각 12회', detail: '최대한 빠르고 폭발적으로 도약, 무릎 정렬 주의' },

    { k: 'a4', name: '스케이터 점프', target: '좌우 왕복 10회', detail: '착지 후 1초간 완벽히 멈춰 하체 밸런스 잡기' },
    { k: 'a5', name: '플랭크 숄더 탭', target: '좌우 왕복 16회', detail: '허리 위에 물잔이 있다고 상상하며 골반 고정' },
    { k: 'a6', name: '버피 점프', target: '15회', detail: '코프볼 리바운드 하듯 만세하며 높이 점프' }
  ]
};

var ROUTINE_B = {
  type: 'B',
  name: 'B루틴 · 감속 / 근력',
  sub: '화·금 — 템포 조절과 근력 강화',
  items: [
    { k: 'b1', name: '싱글레그 힙힌지', target: '양발 각 12회', detail: '[3-1-X] 3초 천천히 다운, 1초 정지 후 폭발적 업' },
    { k: 'b2', name: '파이크 푸시업', target: '10~15회', detail: '엉덩이 높게, 정수리와 양손이 삼각형(△) 이루게' },
    { k: 'b3', name: '링 턱걸이 (풀업/친업)', target: '최대 횟수', detail: '할로우 바디 유지, 지치면 매달려 버티는 네거티브' },
    { k: 'b4', name: '템포 리버스 런지', target: '양발 각 12회', detail: '[3-1-X] 3초 천천히 다운, 약한 다리 먼저 시작' },
    { k: 'b5', name: '스탠딩 우드찹', target: '양방향 각 15회', detail: '4~5kg 메디신볼, 대각선 아래로 강하게 내리찍기' }
  ]
};

var ROUTINE_MOBILITY = {
  type: 'M',
  name: '모빌리티 / 회복 스트레칭',
  sub: '수·토 — 근막 이완과 가동성 회복',
  items: [
    { k: 'm1', name: '폼롤러 / 롤링바', target: '5~10분', detail: '흉추·대퇴사두·장경인대·햄스트링 근막 이완' },
    { k: 'm2', name: '스레드 더 니들', target: '좌우 각 10회', detail: '네발기기에서 팔 뻗어 흉추(등 상부) 회전 열기' },
    { k: 'm3', name: '월드 그레이티스트', target: '좌우 각 5회', detail: '깊은 런지 후 몸통 회전 (고관절·전신 유연성)' },
    { k: 'm4', name: '90/90 스트레칭', target: '좌우 각 2분', detail: '다리 만곡자 모양 후 숙이기 (고관절 회전 범위 확장)' },
    { k: 'm5', name: '문틀 펙 스트레칭', target: '좌우 각 1분', detail: '문틀에 팔 대고 가슴 내밀기 (흉근·어깨 정렬)' }
  ]
};

var ROUTINE_SUNDAY = {
  type: 'S',
  name: '가벼운 스트레칭',
  sub: '일 — 컨디션에 따라 가볍게 또는 완전 휴식',
  items: [
    { k: 's1', name: '전신 스트레칭', target: '10~15분', detail: '편안한 정적 스트레칭, 호흡과 함께' },
    { k: 's2', name: '폼롤러 가볍게', target: '5분', detail: '뭉친 부위 위주로 부드럽게' },
    { k: 's3', name: '산책', target: '20~30분', detail: '가벼운 활동, 회복 촉진' }
  ]
};

var COOLDOWN_ITEMS = [
  { k: 'c1', name: '다운독 자세', target: '30초 유지', detail: '엉덩이 치켜들고 종아리·아킬레스건·햄스트링 이완' },
  { k: 'c2', name: '링 매달려 등 늘리기', target: '30초 유지', detail: '엉덩이 뒤로 빼며 광배근·어깨 주변 부드럽게 이완' },
  { k: 'c3', name: '누워서 둔근 늘리기', target: '좌우 각 30초', detail: '다리를 4자로 만들어 가슴으로 당기기 (엉덩이)' }
];

// 요일별 루틴 매핑 (0=일, 1=월, ...)
var DAY_ROUTINE = {
  0: ROUTINE_SUNDAY,    // 일
  1: ROUTINE_A,         // 월
  2: ROUTINE_B,         // 화
  3: ROUTINE_MOBILITY,  // 수
  4: ROUTINE_A,         // 목
  5: ROUTINE_B,         // 금
  6: ROUTINE_MOBILITY   // 토
};

// 추가 활동 키
var ADDON_KEYS = ['cardio', 'stretch', 'korfball', 'rest', 'recovery'];

var PLAN_START = new Date(2026, 4, 1);

// ═══════════════════════════════════════════
// 저장소
// ═══════════════════════════════════════════
var STORAGE_KEY = 'aokc2026_workout';

function loadStore() {
  try {
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { dates: {} };
}
function saveStore(s) {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
}
var store = loadStore();

// ═══════════════════════════════════════════
// 헬퍼
// ═══════════════════════════════════════════
function dateKey(d) {
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}
function todayDate() {
  var t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}

var currentDate = todayDate();

function getDayData() {
  var k = dateKey(currentDate);
  if (!store.dates[k]) store.dates[k] = {};
  return store.dates[k];
}

function getRoutineForDate(d) {
  // 사용자가 그날 직접 선택한 루틴이 있으면 우선
  var data = store.dates[dateKey(d)];
  if (data && data.routineType && ROUTINE_BY_TYPE[data.routineType]) {
    return ROUTINE_BY_TYPE[data.routineType];
  }
  return DAY_ROUTINE[d.getDay()];
}

// 그날의 요일 기본 추천 루틴 (선택과 무관)
function getRecommendedRoutine(d) {
  return DAY_ROUTINE[d.getDay()];
}

// 타입 → 루틴 객체
var ROUTINE_BY_TYPE = {
  A: ROUTINE_A,
  B: ROUTINE_B,
  M: ROUTINE_MOBILITY,
  S: ROUTINE_SUNDAY
};

function hasCooldown(d) {
  var r = getRoutineForDate(d);
  return r.type === 'A' || r.type === 'B';
}

// 그날의 핵심 루틴 항목 완료 수 (쿨다운 제외)
function getRoutineDone(data, routine) {
  var done = 0;
  for (var i = 0; i < routine.items.length; i++) {
    if (data[routine.items[i].k]) done++;
  }
  return done;
}

// 쿨다운 완료 수
function getCooldownDone(data) {
  var done = 0;
  for (var i = 0; i < COOLDOWN_ITEMS.length; i++) {
    if (data[COOLDOWN_ITEMS[i].k]) done++;
  }
  return done;
}

// 추가 활동 수
function getAddonCount(data) {
  var c = 0;
  for (var i = 0; i < ADDON_KEYS.length; i++) {
    if (data[ADDON_KEYS[i]]) c++;
  }
  return c;
}

// 전체 그날 달성률 (루틴 + 쿨다운 + 추가활동 인정 여부)
function getDayPct(d) {
  var data = store.dates[dateKey(d)] || {};
  var routine = getRoutineForDate(d);
  var routineDone = getRoutineDone(data, routine);
  var routineTotal = routine.items.length;
  var pct = Math.round(routineDone / routineTotal * 100);

  // 쿨다운이 있는 날: 쿨다운 완료 시 추가 점수
  if (hasCooldown(d)) {
    var cdDone = getCooldownDone(data);
    var totalDone = routineDone + cdDone;
    var totalSlots = routineTotal + COOLDOWN_ITEMS.length;
    pct = Math.round(totalDone / totalSlots * 100);
  }
  return pct;
}

// 활동이 있는 날인지 (루틴 1개 이상 OR 추가활동 1개 이상)
function hasActivity(d) {
  var data = store.dates[dateKey(d)] || {};
  var routine = getRoutineForDate(d);
  if (getRoutineDone(data, routine) > 0) return true;
  if (hasCooldown(d) && getCooldownDone(data) > 0) return true;
  for (var i = 0; i < ADDON_KEYS.length; i++) {
    if (data[ADDON_KEYS[i]]) return true;
  }
  return false;
}

// ═══════════════════════════════════════════
// 토글
// ═══════════════════════════════════════════
function toggleItem(k) {
  var data = getDayData();
  data[k] = !data[k];
  saveStore(store);
  renderRoutine();
  renderCooldown();
  updateProgress();
  updateSummary();
}

function toggleOpt(k) {
  var data = getDayData();
  data[k] = !data[k];
  saveStore(store);
  var btn = document.getElementById('opt-' + k);
  if (data[k]) btn.classList.add('on');
  else btn.classList.remove('on');
  updateSummary();
}

// 루틴 직접 선택
function pickRoutine(type) {
  var data = getDayData();
  var rec = getRecommendedRoutine(currentDate);
  if (rec.type === type) {
    // 추천과 같은 걸 고르면 선택 해제 (기본값으로 복귀)
    delete data.routineType;
  } else {
    data.routineType = type;
  }
  saveStore(store);
  render();
}

function saveMemo() {
  var data = getDayData();
  data.memo = document.getElementById('memo-input').value;
  saveStore(store);
  showSavedIndicator('memo-saved', false);
}

var saveTimers = {};
function showSavedIndicator(elId, immediate) {
  var ind = document.getElementById(elId);
  if (!ind) return;
  if (saveTimers[elId]) {
    clearTimeout(saveTimers[elId].t1);
    clearTimeout(saveTimers[elId].t2);
  }
  saveTimers[elId] = {};
  if (immediate) {
    ind.textContent = '✓ 저장됨';
    ind.className = 'save-indicator saved show';
    saveTimers[elId].t2 = setTimeout(function() {
      ind.classList.remove('show');
    }, 2000);
  } else {
    ind.textContent = '💾 저장 중...';
    ind.className = 'save-indicator saving show';
    saveTimers[elId].t1 = setTimeout(function() {
      ind.textContent = '✓ 저장됨';
      ind.className = 'save-indicator saved show';
      saveTimers[elId].t2 = setTimeout(function() {
        ind.classList.remove('show');
      }, 2000);
    }, 400);
  }
}

function resetToday() {
  if (!window.confirm(dateKey(currentDate) + ' 의 운동 기록을 모두 초기화할까요?')) return;
  delete store.dates[dateKey(currentDate)];
  saveStore(store);
  render();
}

// ═══════════════════════════════════════════
// 렌더
// ═══════════════════════════════════════════
function render() {
  // 날짜
  var t = todayDate();
  var weekDays = ['일','월','화','수','목','금','토'];
  var dayText = '';
  if (dateKey(currentDate) === dateKey(t)) dayText = '오늘';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()-1))) dayText = '어제';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()+1))) dayText = '내일';
  else dayText = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일';
  document.getElementById('date-text').firstChild.nodeValue = dayText;
  document.getElementById('date-sub').textContent = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일 (' + weekDays[currentDate.getDay()] + ')';

  // 오늘 루틴 안내
  var routine = getRoutineForDate(currentDate);
  var infoEl = document.getElementById('today-info');
  var routineDesc = {
    A: '<strong>월·목 폭발력 루틴</strong>입니다. 빠르고 강하게 동작, 6개 운동을 모두 체크하세요.',
    B: '<strong>화·금 근력 루틴</strong>입니다. 템포 조절([3-1-X])이 핵심, 5개 운동.',
    M: '<strong>수·토 모빌리티 회복일</strong>입니다. 근막 이완과 가동성 회복, 5개 항목.',
    S: '<strong>일요일 회복일</strong>입니다. 컨디션에 따라 가볍게 또는 완전 휴식.'
  };
  infoEl.innerHTML = routineDesc[routine.type] || '';

  // 추가 활동 상태
  var data = store.dates[dateKey(currentDate)] || {};
  for (var i = 0; i < ADDON_KEYS.length; i++) {
    var btn = document.getElementById('opt-' + ADDON_KEYS[i]);
    if (btn) {
      if (data[ADDON_KEYS[i]]) btn.classList.add('on');
      else btn.classList.remove('on');
    }
  }

  // 메모
  document.getElementById('memo-input').value = data.memo || '';

  renderRoutine();
  renderCooldown();
  updateProgress();
  updateSummary();
}

function renderRoutine() {
  var routine = getRoutineForDate(currentDate);
  var data = store.dates[dateKey(currentDate)] || {};
  document.getElementById('routine-title').textContent = '🏋️ ' + routine.name.split('·')[0].trim();
  document.getElementById('routine-sub').textContent = routine.sub;
  var badge = document.getElementById('routine-badge');
  var badgeText = { A: 'A루틴', B: 'B루틴', M: '회복일', S: '일요일' };
  badge.textContent = badgeText[routine.type];
  badge.className = 'routine-badge ' + routine.type;

  // 루틴 선택 버튼 상태
  var rec = getRecommendedRoutine(currentDate);
  var recName = { A: 'A루틴(폭발력)', B: 'B루틴(근력)', M: '모빌리티', S: '가벼운 스트레칭' };
  var recEl = document.getElementById('rec-routine');
  if (recEl) recEl.textContent = recName[rec.type];
  var labelEl = document.getElementById('routine-picker-label');
  if (data.routineType && data.routineType !== rec.type) {
    labelEl.innerHTML = '오늘 추천: <strong>' + recName[rec.type] + '</strong> · 직접 <strong>' + recName[routine.type] + '</strong> 선택함';
  } else {
    labelEl.innerHTML = '오늘 추천: <strong>' + recName[rec.type] + '</strong> · 다른 루틴으로 바꿀 수 있어요';
  }
  var types = ['A', 'B', 'M', 'S'];
  for (var ti = 0; ti < types.length; ti++) {
    var rb = document.getElementById('rp-' + types[ti]);
    if (rb) {
      if (routine.type === types[ti]) rb.classList.add('on');
      else rb.classList.remove('on');
    }
  }

  var html = '';
  for (var i = 0; i < routine.items.length; i++) {
    var item = routine.items[i];
    var done = !!data[item.k];
    html += '<div class="workout-row' + (done ? ' done' : '') + '" onclick="toggleItem(\'' + item.k + '\')">';
    html += '<div class="checkbox' + (done ? ' done' : '') + '"></div>';
    html += '<div class="workout-content">';
    html += '<div><span class="workout-num">' + (i+1) + '</span>';
    html += '<span class="workout-name">' + item.name + '</span>';
    html += '<span class="workout-target ' + routine.type + '">' + item.target + '</span></div>';
    html += '<div class="workout-detail">' + item.detail + '</div>';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('routine-items').innerHTML = html;
}

function renderCooldown() {
  var card = document.getElementById('cooldown-card');
  if (!hasCooldown(currentDate)) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  var data = store.dates[dateKey(currentDate)] || {};
  var html = '';
  for (var i = 0; i < COOLDOWN_ITEMS.length; i++) {
    var item = COOLDOWN_ITEMS[i];
    var done = !!data[item.k];
    html += '<div class="workout-row' + (done ? ' done' : '') + '" onclick="toggleItem(\'' + item.k + '\')">';
    html += '<div class="checkbox' + (done ? ' done' : '') + '"></div>';
    html += '<div class="workout-content">';
    html += '<div><span class="workout-num">' + (i+1) + '</span>';
    html += '<span class="workout-name">' + item.name + '</span>';
    html += '<span class="workout-target C">' + item.target + '</span></div>';
    html += '<div class="workout-detail">' + item.detail + '</div>';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('cooldown-items').innerHTML = html;
}

function updateProgress() {
  var data = store.dates[dateKey(currentDate)] || {};
  var routine = getRoutineForDate(currentDate);
  var routineDone = getRoutineDone(data, routine);
  var routineTotal = routine.items.length;
  var totalDone = routineDone;
  var totalSlots = routineTotal;
  if (hasCooldown(currentDate)) {
    totalDone += getCooldownDone(data);
    totalSlots += COOLDOWN_ITEMS.length;
  }
  var pct = Math.round(totalDone / totalSlots * 100);
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-text').textContent = totalDone + '/' + totalSlots + ' 항목 완료';
}

function updateSummary() {
  // 오늘 달성률
  var pct = getDayPct(currentDate);
  document.getElementById('sum-today').textContent = pct + '%';

  // 7일 운동한 날
  var t = todayDate();
  var weekCount = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    if (hasActivity(d)) weekCount++;
  }
  document.getElementById('sum-week').textContent = weekCount;

  // 연속 일수
  var streak = 0;
  var d = todayDate();
  while (true) {
    if (hasActivity(d)) {
      streak++;
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
      if (d < PLAN_START) break;
    } else {
      break;
    }
  }
  document.getElementById('sum-streak').textContent = streak;
}

// ═══════════════════════════════════════════
// 날짜 이동
// ═══════════════════════════════════════════
function changeDate(delta) {
  var d = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + delta);
  var t = todayDate();
  var min = PLAN_START;
  var max = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  if (d < min) return;
  if (d > max) return;
  currentDate = d;
  render();
}

// ═══════════════════════════════════════════
// 뷰 전환
// ═══════════════════════════════════════════
function switchView(v) {
  if (v === 'day') {
    document.getElementById('view-day').style.display = '';
    document.getElementById('view-week').style.display = 'none';
    document.getElementById('view-day-btn').classList.add('on');
    document.getElementById('view-week-btn').classList.remove('on');
  } else {
    document.getElementById('view-day').style.display = 'none';
    document.getElementById('view-week').style.display = '';
    document.getElementById('view-day-btn').classList.remove('on');
    document.getElementById('view-week-btn').classList.add('on');
    renderWeekly();
  }
  window.scrollTo(0, 0);
}

function renderWeekly() {
  var t = todayDate();
  var weekDays = ['일','월','화','수','목','금','토'];
  var typeLabel = { A: 'A루틴', B: 'B루틴', M: '회복', S: '일요' };

  var html = '';
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var pct = getDayPct(d);
    var routine = getRoutineForDate(d);
    var label = '';
    if (i === 0) label = '오늘';
    else if (i === 1) label = '어제';
    else label = (d.getMonth()+1) + '/' + d.getDate() + ' ' + weekDays[d.getDay()];

    html += '<div class="weekly-row">';
    html += '<div class="weekly-day">' + label + '</div>';
    html += '<div class="weekly-bar-track">';
    if (pct > 0) html += '<div class="weekly-bar-fill" style="width:' + pct + '%"></div>';
    html += '</div>';
    html += '<div class="weekly-label">' + typeLabel[routine.type] + '</div>';
    html += '<div class="weekly-pct">' + pct + '%</div>';
    html += '</div>';
  }
  document.getElementById('weekly-list').innerHTML = html;

  // 30일 통계
  var trackedDays = 0;
  var activeDays = 0;
  var typeCounts = { A: 0, B: 0, M: 0, S: 0 };
  var addonCounts = { cardio: 0, stretch: 0, korfball: 0, rest: 0, recovery: 0 };
  var totalPct = 0;

  for (var i = 0; i < 30; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    if (d < PLAN_START) break;
    var data = store.dates[dateKey(d)];
    if (!data) continue;
    trackedDays++;
    if (hasActivity(d)) {
      activeDays++;
      var routine = getRoutineForDate(d);
      var routineDone = getRoutineDone(data, routine);
      if (routineDone > 0) typeCounts[routine.type]++;
    }
    for (var j = 0; j < ADDON_KEYS.length; j++) {
      if (data[ADDON_KEYS[j]]) addonCounts[ADDON_KEYS[j]]++;
    }
    totalPct += getDayPct(d);
  }
  var avgPct = trackedDays ? Math.round(totalPct / trackedDays) : 0;

  var statsHtml = '';
  if (trackedDays === 0) {
    statsHtml = '<div class="empty-state">아직 기록이 없어요</div>';
  } else {
    statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">운동한 날</div><div class="weekly-pct" style="width:auto;font-size:14px">' + activeDays + '/' + trackedDays + '일</div></div>';
    statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">평균 달성률</div><div class="weekly-pct" style="width:auto;font-size:14px">' + avgPct + '%</div></div>';
    if (typeCounts.A) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">A루틴 (폭발력)</div><div class="weekly-pct" style="width:auto;font-size:14px">' + typeCounts.A + '회</div></div>';
    if (typeCounts.B) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">B루틴 (근력)</div><div class="weekly-pct" style="width:auto;font-size:14px">' + typeCounts.B + '회</div></div>';
    if (typeCounts.M) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">모빌리티 (수·토)</div><div class="weekly-pct" style="width:auto;font-size:14px">' + typeCounts.M + '회</div></div>';
    if (addonCounts.korfball) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🏆 코프볼 훈련</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.korfball + '회</div></div>';
    if (addonCounts.cardio) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🏃‍♂️ 유산소</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.cardio + '회</div></div>';
    if (addonCounts.stretch) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🧘 스트레칭</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.stretch + '회</div></div>';
    if (addonCounts.rest) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🛌 휴식</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.rest + '회</div></div>';
    if (addonCounts.recovery) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🩹 회복 루틴</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.recovery + '회</div></div>';
  }
  document.getElementById('month-stats').innerHTML = statsHtml;
}

function goHome() {
  window.location.href = 'index.html';
}

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
render();

</script>
