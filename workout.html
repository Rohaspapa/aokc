<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동 기록">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon" sizes="360x360" href="icon-360.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#B8412A">
<title>운동 기록 — AOKC 2026</title>
<style>
:root {
  --c-bg: #F5F2EA;
  --c-surface: #FFFFFF;
  --c-surface-2: #FAF8F2;
  --c-border: #E0DCCF;
  --c-text: #1A1916;
  --c-muted: #7A7468;
  --c-accent: #0F4C36;
  --c-accent-2: #1D6B47;
  --c-accent-light: #DCE9E1;
  --c-amber: #B57318;
  --c-amber-light: #F8EBCF;
  --c-coral: #B8412A;
  --c-coral-2: #D45438;
  --c-coral-light: #F8E2DA;
  --c-blue: #1A5CA0;
  --c-blue-light: #DEEAF7;
  --c-purple: #5C3DAF;
  --c-purple-light: #E8E2F5;
  --c-good: #2D7A4E;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  padding-bottom: calc(20px + var(--safe-bottom));
}

/* 헤더 */
.header {
  background: -webkit-linear-gradient(180deg, #B8412A 0%, #D45438 100%);
  background: linear-gradient(180deg, #B8412A 0%, #D45438 100%);
  color: #fff;
  padding: 16px 18px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-row {
  display: -webkit-flex;
  display: flex;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-align-items: center;
  align-items: center;
}
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.back-btn {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.content { padding: 14px; }

/* 토글 */
.toggle-section {
  display: -webkit-flex;
  display: flex;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 12px;
}
.toggle-btn {
  -webkit-flex: 1;
  flex: 1;
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--c-muted);
  cursor: pointer;
  font-family: inherit;
}
.toggle-btn.on {
  background: var(--c-surface);
  color: var(--c-text);
  -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* 날짜 바 */
.date-bar {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.date-btn {
  background: var(--c-coral-light);
  color: var(--c-coral);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.date-text { font-size: 14px; font-weight: 700; }
.date-text .sub {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--c-muted);
  margin-top: 2px;
}

/* 루틴 배지 (오늘의 루틴 라벨) */
.routine-badge {
  display: -webkit-inline-flex;
  display: inline-flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.routine-badge.A { background: var(--c-coral-light); color: var(--c-coral); }
.routine-badge.B { background: var(--c-blue-light); color: var(--c-blue); }
.routine-badge.M { background: var(--c-accent-light); color: var(--c-accent); }
.routine-badge.S { background: var(--c-amber-light); color: #6B5510; }

/* 루틴 선택기 */
.routine-picker {
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 12px;
}
.routine-picker-label {
  font-size: 11px;
  color: var(--c-muted);
  margin-bottom: 8px;
  line-height: 1.4;
}
.routine-picker-label strong { color: var(--c-coral); font-weight: 700; }
.routine-picker-btns {
  display: -webkit-flex;
  display: flex;
  gap: 6px;
}
.rp-btn {
  -webkit-flex: 1;
  flex: 1;
  padding: 9px 4px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
  background: var(--c-surface);
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  color: var(--c-muted);
  cursor: pointer;
  font-family: inherit;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
}
.rp-btn:active { -webkit-transform: scale(0.96); transform: scale(0.96); }
.rp-btn.on {
  background: var(--c-coral);
  border-color: var(--c-coral);
  color: #fff;
}

/* 진행 바 */
.progress-wrap {
  background: var(--c-border);
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 4px;
}
.progress-fill {
  height: 100%;
  background: -webkit-linear-gradient(left, var(--c-coral), var(--c-coral-2));
  background: linear-gradient(90deg, var(--c-coral), var(--c-coral-2));
  -webkit-transition: width 0.3s;
  transition: width 0.3s;
  border-radius: 4px;
}
.progress-text {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--c-coral);
  margin-bottom: 14px;
}

/* 카드 */
.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  gap: 6px;
}
.card-title-text {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 6px;
}
.card-sub {
  font-size: 11px;
  color: var(--c-muted);
  margin-top: -4px;
  margin-bottom: 10px;
}

/* 운동 체크 항목 */
.workout-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: flex-start;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.workout-row:last-child { border-bottom: none; }
.checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--c-muted);
  border-radius: 6px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  margin-right: 11px;
  margin-top: 1px;
  position: relative;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
  background: #fff;
}
.checkbox.done {
  background: var(--c-coral);
  border-color: var(--c-coral);
}
.checkbox.done:after {
  content: '';
  position: absolute;
  left: 5px;
  top: 1px;
  width: 6px;
  height: 11px;
  border: solid #fff;
  border-width: 0 2.5px 2.5px 0;
  -webkit-transform: rotate(45deg);
  transform: rotate(45deg);
}
.workout-content {
  -webkit-flex: 1;
  flex: 1;
}
.workout-num {
  display: inline-block;
  width: 18px;
  height: 18px;
  background: var(--c-surface-2);
  color: var(--c-muted);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  line-height: 18px;
  border-radius: 4px;
  margin-right: 6px;
  vertical-align: middle;
}
.workout-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
  line-height: 1.4;
  display: inline;
}
.workout-row.done .workout-name {
  color: var(--c-muted);
  text-decoration: line-through;
}
.workout-detail {
  font-size: 11px;
  color: var(--c-muted);
  margin-top: 3px;
  margin-left: 24px;
  line-height: 1.4;
}
.workout-target {
  display: inline-block;
  background: var(--c-coral-light);
  color: var(--c-coral);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  margin-left: 4px;
  vertical-align: middle;
}
.workout-target.B { background: var(--c-blue-light); color: var(--c-blue); }
.workout-target.M { background: var(--c-accent-light); color: var(--c-accent); }
.workout-target.S { background: var(--c-amber-light); color: #6B5510; }
.workout-target.C { background: var(--c-purple-light); color: var(--c-purple); }
.workout-target.W { background: #fdf0d5; color: #a0741c; }
.routine-badge.W { background: #fdf0d5; color: #a0741c; }
.grip-badge { display:inline-block; font-size:9.5px; font-weight:800; color:#fff; background:var(--c-coral); border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:1px; }
.workout-row.grip-warn { background:rgba(184,65,42,0.04); }

/* 엄지 주의사항 경고 */
.rehab-warn-head { font-size:13.5px; font-weight:800; color:var(--c-coral); margin-bottom:8px; }
.rehab-warn-list { margin:0; padding-left:18px; }
.rehab-warn-list li { font-size:12px; color:var(--c-ink); line-height:1.6; margin-bottom:4px; }
.rehab-warn-list li strong { color:var(--c-coral); }
/* 재활 체크포인트 접이식 헤더 */
.rehab-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.rehab-title { font-size:14px; font-weight:800; color:var(--c-ink); }
.rehab-badge-inline { display:inline-block; font-size:11px; font-weight:800; color:var(--c-coral); background:var(--c-coral-light); border-radius:10px; padding:1px 8px; margin-left:8px; }
.rehab-caret { font-size:13px; color:var(--c-ink-soft); }

/* 국면 컨트롤 */
.phase-controls { margin: 10px 0 4px; padding: 10px; background: #faf8f3; border: 1px solid var(--c-line); border-radius: 10px; }
.phase-ctrl-btn { width: 100%; padding: 9px; border: 1.5px solid var(--c-line); border-radius: 8px; background: #fff; font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--c-ink); cursor: pointer; margin-bottom: 8px; }
.phase-ctrl-btn.on { background: #fdf0d5; border-color: #d9a441; color: #8a5a00; }
.phase-ctrl-btn:active { -webkit-transform: scale(0.98); transform: scale(0.98); }
.phase-select-row { display: flex; align-items: center; gap: 8px; }
.phase-select-lbl { font-size: 11.5px; color: var(--c-ink-soft); font-weight: 600; white-space: nowrap; }
.phase-select { flex: 1; padding: 7px 8px; border: 1px solid var(--c-line); border-radius: 7px; font-family: inherit; font-size: 12px; background: #fff; color: var(--c-ink); }
.phase-manual-note { font-size: 11px; color: var(--c-coral); margin-top: 7px; }
.phase-manual-note a { color: var(--c-blue); font-weight: 600; }

/* 단순 옵션 그리드 (유산소·스트레칭·휴식·코프볼) */
.option-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.option-btn {
  background: var(--c-surface-2);
  border: 1.5px solid var(--c-border);
  padding: 14px 8px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.option-btn:active { -webkit-transform: scale(0.97); transform: scale(0.97); }
.option-btn.on {
  background: var(--c-coral-light);
  border-color: var(--c-coral);
}
.option-btn.on .opt-check { display: -webkit-inline-flex; display: inline-flex; }
.option-icon {
  font-size: 22px;
  display: block;
  margin-bottom: 4px;
}
.option-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-text);
}
.option-sub {
  font-size: 10px;
  color: var(--c-muted);
  margin-top: 2px;
}
.opt-check {
  display: none;
  width: 18px;
  height: 18px;
  background: var(--c-coral);
  color: #fff;
  border-radius: 50%;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  margin-top: 6px;
  margin-left: auto;
  margin-right: auto;
}

/* 메모 */
.memo-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--c-border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  resize: vertical;
  min-height: 70px;
  line-height: 1.5;
}
.memo-input:focus { outline: none; border-color: var(--c-coral); }

/* 저장 표시 */
.save-indicator {
  font-size: 11px;
  font-weight: 600;
  -webkit-transition: opacity 0.3s ease;
  transition: opacity 0.3s ease;
  opacity: 0;
  white-space: nowrap;
}
.save-indicator.show { opacity: 1; }
.save-indicator.saving { color: var(--c-muted); }
.save-indicator.saved { color: var(--c-good); }

/* 요약 */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.summary-box {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.summary-num {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--c-coral);
}
.summary-num.gold { color: #B8923A; }
.summary-lbl {
  font-size: 10px;
  color: var(--c-muted);
  margin-top: 4px;
  font-weight: 600;
}

/* 주간 뷰 */
.weekly-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 12px;
}
.weekly-day {
  width: 60px;
  font-weight: 600;
  color: var(--c-muted);
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  font-size: 11px;
}
.weekly-bar-track {
  -webkit-flex: 1;
  flex: 1;
  height: 18px;
  background: var(--c-surface-2);
  border-radius: 4px;
  overflow: hidden;
}
.weekly-bar-fill {
  height: 100%;
  background: -webkit-linear-gradient(left, var(--c-coral), var(--c-coral-2));
  background: linear-gradient(90deg, var(--c-coral), var(--c-coral-2));
  -webkit-transition: width 0.3s;
  transition: width 0.3s;
}
.weekly-pct {
  width: 36px;
  text-align: right;
  font-weight: 700;
  font-size: 12px;
  color: var(--c-coral);
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.weekly-label {
  font-size: 10px;
  color: var(--c-muted);
  width: 30px;
  text-align: right;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}

.empty-state {
  text-align: center;
  padding: 24px 16px;
  color: var(--c-muted);
  font-size: 12.5px;
  line-height: 1.6;
}

.btn-secondary {
  width: 100%;
  background: transparent;
  border: 1px solid var(--c-border);
  padding: 11px;
  border-radius: 10px;
  color: var(--c-muted);
  font-size: 13px;
  font-weight: 500;
  margin-top: 6px;
  cursor: pointer;
  font-family: inherit;
}

/* 정보 박스 */
.info-box {
  background: var(--c-coral-light);
  border: 1px solid #E8B6A8;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 11.5px;
  color: #6B1E0E;
  line-height: 1.5;
  margin-bottom: 12px;
}
.info-box strong { font-weight: 700; }

</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>🏋️ 운동 기록</h1>
      <p>오늘의 홈 워크아웃을 체크</p>
    </div>
    <button class="back-btn" onclick="goHome()">← 메인</button>
  </div>
</div>

<div class="content">

  <div class="toggle-section">
    <button class="toggle-btn on" id="view-day-btn" onclick="switchView('day')">📅 오늘</button>
    <button class="toggle-btn" id="view-week-btn" onclick="switchView('week')">📊 주간</button>
  </div>

  <!-- 일별 -->
  <div id="view-day">

    <div class="date-bar">
      <button class="date-btn" onclick="changeDate(-1)">‹</button>
      <div class="date-text" id="date-text">오늘
        <span class="sub" id="date-sub"></span>
      </div>
      <button class="date-btn" onclick="changeDate(1)">›</button>
    </div>

    <!-- 오늘 루틴 안내 -->
    <div class="info-box" id="today-info"></div>

    <!-- 요약 -->
    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-num" id="sum-today">0%</div>
        <div class="summary-lbl">루틴 달성</div>
      </div>
      <div class="summary-box">
        <div class="summary-num gold" id="sum-streak">0</div>
        <div class="summary-lbl">연속 일수</div>
      </div>
      <div class="summary-box">
        <div class="summary-num" id="sum-week">0</div>
        <div class="summary-lbl">7일 운동</div>
      </div>
    </div>

    <!-- 진행 -->
    <div class="progress-wrap">
      <div class="progress-fill" id="prog-bar" style="width:0%"></div>
    </div>
    <div class="progress-text" id="prog-text">0/0 항목 완료</div>

    <!-- 엄지 재활: 회복기=주의사항 / 재건기=접이식 체크포인트 -->
    <div class="card" id="rehab-card" style="display:none">
      <div id="rehab-card-inner"></div>
    </div>

    <!-- 웜업 카드 (A·B 루틴 일에만) -->
    <div class="card" id="warmup-card" style="display:none">
      <div class="card-title">
        <span class="card-title-text">🔥 웜업 (RAMP)</span>
        <span class="routine-badge W">운동 전 필수</span>
      </div>
      <div class="card-sub">체온 → 활성화 → 가동성 → 점화. 웜업 없이는 점프도 없습니다.</div>
      <div id="warmup-items"></div>
    </div>

    <!-- 오늘의 루틴 카드 -->
    <div class="card" id="routine-card">
      <div class="card-title">
        <span class="card-title-text" id="routine-title">🏋️ 오늘의 루틴</span>
        <span class="routine-badge" id="routine-badge"></span>
      </div>
      <div class="card-sub" id="routine-sub"></div>

      <!-- 루틴 선택 -->
      <div class="routine-picker">
        <div class="routine-picker-label" id="routine-picker-label">오늘 추천: <strong id="rec-routine"></strong> · 다른 루틴으로 바꿀 수 있어요</div>
        <div class="routine-picker-btns">

function ymdToDate(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

function getPhaseForDate(d){
  var day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  for(var i=0;i<PHASES.length;i++){
    var ph=PHASES[i];
    if(day>=ymdToDate(ph.from) && day<=ymdToDate(ph.to)) return ph;
  }
  // 경계 밖: 첫 국면 이전이면 회복기, 마지막 이후면 테이퍼
  if(day < ymdToDate(PHASES[0].from)) return PHASES[0];
  return PHASES[PHASES.length-1];
}

// 요일 → 루틴 타입 (0=일 S, 월A 화B 수M 목A 금B 토M)
var DAY_TYPE = { 0:'S', 1:'A', 2:'B', 3:'M', 4:'A', 5:'B', 6:'M' };

// 국면 key + 타입 → 루틴 객체 {type,name,sub,items}
function buildRoutine(phaseKey, type){
  var r = PHASE_ROUTINES[phaseKey][type];
  return { type:type, name:r.name, sub:r.sub, items:r.items };
}

function dateKey(d) {
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}
function todayDate() {
  var t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}

// 국면 판정 (수동 오버라이드 + '오늘은 가볍게' 반영)
// ─────────────────────────────────────────────
var PHASE_ORDER = ['recovery','rebuild','strength','convert','taper'];
var MANUAL_PHASE_KEY = 'aokc2026_manual_phase'; // 수동 선택 국면(며칠 이상 지속용)

function getManualPhase(){
  try{ return localStorage.getItem(MANUAL_PHASE_KEY) || null; }catch(e){ return null; }
}
function setManualPhase(key){
  try{ if(key) localStorage.setItem(MANUAL_PHASE_KEY, key); else localStorage.removeItem(MANUAL_PHASE_KEY); }catch(e){}
}
function phaseByKey(key){
  for(var i=0;i<PHASES.length;i++) if(PHASES[i].key===key) return PHASES[i];
  return null;
}

// 그날 적용 국면: 그날 데이터의 easy 플래그는 강도만 낮춤(국면 자체는 유지)
// 우선순위: 그날 수동 dayPhase > 전역 수동 국면 > 날짜 자동
function getEffectivePhase(d){
  var data = store.dates[dateKey(d)];
  if(data && data.dayPhase && phaseByKey(data.dayPhase)) return phaseByKey(data.dayPhase);
  var manual = getManualPhase();
  if(manual && phaseByKey(manual)) return phaseByKey(manual);
  return getPhaseForDate(d);
}

// '오늘은 가볍게': 해당 국면에서 한 단계 쉬운 국면 key 반환 (강도 다운)
function easierPhaseKey(key){
  var idx = PHASE_ORDER.indexOf(key);
  // 재건기 이상은 한 단계 아래로, 회복기는 그대로(이미 최저)
  if(idx <= 0) return 'recovery';
  return PHASE_ORDER[idx-1];
}

function getRoutineForDate(d) {
  var data = store.dates[dateKey(d)] || {};
  var phase = getEffectivePhase(d);
  var phaseKey = phase.key;
  // '오늘은 가볍게' 플래그 → 한 단계 쉬운 국면 루틴
  if(data.easy) phaseKey = easierPhaseKey(phaseKey);
  // 그날 직접 선택한 루틴 타입 우선, 없으면 요일 기본
  var type = (data.routineType && PHASE_ROUTINES[phaseKey][data.routineType]) ? data.routineType : DAY_TYPE[d.getDay()];
  return buildRoutine(phaseKey, type);
}

// 그날의 요일 기본 추천 루틴 (선택과 무관, 현재 국면 기준)
function getRecommendedRoutine(d) {
  var phase = getEffectivePhase(d);
  return buildRoutine(phase.key, DAY_TYPE[d.getDay()]);
}

function hasCooldown(d) {
  var r = getRoutineForDate(d);
  return r.type === 'A' || r.type === 'B';
}
function hasWarmup(d) {
  var r = getRoutineForDate(d);
  return r.type === 'A' || r.type === 'B';
}

// 현재 국면의 웜업/쿨다운 항목
function getWarmupItems(d){
  var phase = getEffectivePhase(d);
  var data = store.dates[dateKey(d)] || {};
  var key = phase.key;
  if(data.easy) key = easierPhaseKey(key);
  return PHASE_WARMUP[key] || PHASE_WARMUP.recovery;
}
function getCooldownItems(d){
  return PHASE_COOLDOWN._default;
}

// 그날의 핵심 루틴 항목 완료 수 (웜업·쿨다운 제외)
function getRoutineDone(data, routine) {
  var done = 0;
  for (var i = 0; i < routine.items.length; i++) {
    if (data[routine.items[i].k]) done++;
  }
  return done;
}

// 쿨다운 완료 수
function getCooldownDone(data, d) {
  var items = getCooldownItems(d || currentDate);
  var done = 0;
  for (var i = 0; i < items.length; i++) {
    if (data[items[i].k]) done++;
  }
  return done;
}
// 웜업 완료 수
function getWarmupDone(data, d) {
  var items = getWarmupItems(d || currentDate);
  var done = 0;
  for (var i = 0; i < items.length; i++) {
    if (data[items[i].k]) done++;
  }
  return done;
}

// 추가 활동 수
function getAddonCount(data) {
  var c = 0;
  for (var i = 0; i < ADDON_KEYS.length; i++) {
    if (data[ADDON_KEYS[i]]) c++;
  }
  return c;
}

// 전체 그날 달성률 (웜업 + 루틴 + 쿨다운 + 추가활동 인정 여부)
function getDayPct(d) {
  var data = store.dates[dateKey(d)] || {};
  var routine = getRoutineForDate(d);
  var routineDone = getRoutineDone(data, routine);
  var routineTotal = routine.items.length;
  if (routineTotal === 0) return 0;
  var totalDone = routineDone;
  var totalSlots = routineTotal;

  // 웜업·쿨다운이 있는 날(A·B): 완료 시 합산
  if (hasWarmup(d)) {
    totalDone += getWarmupDone(data, d);
    totalSlots += getWarmupItems(d).length;
  }
  if (hasCooldown(d)) {
    totalDone += getCooldownDone(data, d);
    totalSlots += getCooldownItems(d).length;
  }
  return Math.round(totalDone / totalSlots * 100);
}

// 활동이 있는 날인지 (루틴/웜업/쿨다운 1개 이상 OR 추가활동 1개 이상)
function hasActivity(d) {
  var data = store.dates[dateKey(d)] || {};
  var routine = getRoutineForDate(d);
  if (getRoutineDone(data, routine) > 0) return true;
  if (hasWarmup(d) && getWarmupDone(data, d) > 0) return true;
  if (hasCooldown(d) && getCooldownDone(data, d) > 0) return true;
  for (var i = 0; i < ADDON_KEYS.length; i++) {
    if (data[ADDON_KEYS[i]]) return true;
  }
  return false;
}

}

function resetToday() {
  if (!window.confirm(dateKey(currentDate) + ' 의 운동 기록을 모두 초기화할까요?')) return;
  delete store.dates[dateKey(currentDate)];
  saveStore(store);
  render();
}

// ═══════════════════════════════════════════
// 렌더
// ═══════════════════════════════════════════
function render() {
  // 날짜
  var t = todayDate();
  var weekDays = ['일','월','화','수','목','금','토'];
  var dayText = '';
  if (dateKey(currentDate) === dateKey(t)) dayText = '오늘';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()-1))) dayText = '어제';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()+1))) dayText = '내일';
  else dayText = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일';
  document.getElementById('date-text').firstChild.nodeValue = dayText;
  document.getElementById('date-sub').textContent = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일 (' + weekDays[currentDate.getDay()] + ')';

  // 오늘 루틴 안내 + 국면 배너
  var routine = getRoutineForDate(currentDate);
  var phase = getEffectivePhase(currentDate);
  var data = store.dates[dateKey(currentDate)] || {};
  var infoEl = document.getElementById('today-info');
  var typeLabel = { A:'파워', B:'근력', M:'모빌리티', S:'회복' };
  var dday = Math.round((COMPETITION_DATE - new Date(currentDate.getFullYear(),currentDate.getMonth(),currentDate.getDate()))/86400000);
  var autoPhase = getPhaseForDate(currentDate);
  var manualNote = '';
  if(data.dayPhase) manualNote = ' · <span style="color:#B8412A">이 날만 '+phaseByKey(data.dayPhase).name+' 선택</span>';
  else if(getManualPhase() && getManualPhase()!==autoPhase.key) manualNote = ' · <span style="color:#B8412A">수동 '+phase.name+' 유지 중</span>';
  var easyNote = data.easy ? ' · <span style="color:#C77F2E">😌 오늘은 가볍게</span>' : '';
  infoEl.innerHTML = '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
    + '<span style="font-weight:800;color:'+phase.color+'">'+phase.id+' '+phase.name+'</span>'
    + '<span style="font-size:11px;color:#8B7355">D-'+dday+'</span>'
    + manualNote + easyNote + '</div>'
    + '<div style="font-size:12px;color:#8B7355;margin-top:4px">'+phase.focus+'</div>';

  // 추가 활동 상태
  for (var i = 0; i < ADDON_KEYS.length; i++) {
    var btn = document.getElementById('opt-' + ADDON_KEYS[i]);
    if (btn) {
      if (data[ADDON_KEYS[i]]) btn.classList.add('on');
      else btn.classList.remove('on');
    }
  }

  // 메모
  document.getElementById('memo-input').value = data.memo || '';

  renderRehab();
  renderWarmup();
  renderRoutine();
  renderCooldown();
  updateProgress();
  updateSummary();
  renderPhaseControls();
}

// 엄지 재활 체크포인트 + 회복기 주의사항
function renderRehab() {
  var card = document.getElementById('rehab-card');
  if (!card) return;
  var phase = getEffectivePhase(currentDate);
  var allClear = rehabAllClear();

  // 표시 규칙:
  //  - 회복기: 간결한 '엄지 주의사항' 경고만
  //  - 재건기: 재활 체크포인트(접이식), 통과하면 숨김
  //  - 강화기 이후: 숨김
  if (phase.key === 'recovery') {
    card.style.display = '';
    card.className = 'card';
    card.style.borderColor = 'var(--c-coral)';
    document.getElementById('rehab-card-inner').innerHTML =
        '<div class="rehab-warn-head">⚠️ 엄지 탈구 주의사항</div>'
      + '<ul class="rehab-warn-list">'
      + '<li>오른손 <strong>엄지로 쥐거나 바닥을 짚는 동작 금지</strong> — 지지는 왼손·전완·주먹으로</li>'
      + '<li>통증·부기·저림이 <strong>악화되면 즉시 중단</strong>하고 무리하지 않기</li>'
      + '<li>하체·유산소·코어는 정상 진행 가능 · <strong>그립/당기기 운동은 회복 후에</strong></li>'
      + '<li>복귀 시점과 재활 강도는 <strong>반드시 의료진과 확인</strong></li>'
      + '</ul>';
    return;
  }

  if (phase.key === 'rebuild' && !allClear) {
    card.style.display = '';
    card.className = 'card';
    card.style.borderColor = 'var(--c-coral)';
    var r = loadRehab();
    var collapsed = getRehabCollapsed();
    var doneCount = 0;
    for (var j=0;j<REHAB_CHECKS.length;j++){ if(r[REHAB_CHECKS[j].k]) doneCount++; }

    var html = '<div class="rehab-head" onclick="toggleRehabCollapse()">';
    html += '<div><span class="rehab-title">🩹 엄지 재활 체크포인트</span>';
    html += '<span class="rehab-badge-inline">' + doneCount + '/' + REHAB_CHECKS.length + '</span></div>';
    html += '<span class="rehab-caret">' + (collapsed ? '▾' : '▴') + '</span>';
    html += '</div>';
    html += '<div class="rehab-collapse" style="display:' + (collapsed ? 'none' : 'block') + '">';
    html += '<div class="card-sub" style="margin:8px 0 4px">재건기입니다. 그립 운동을 열기 전 아래 4가지를 모두 확인하세요.</div>';
    for (var i=0;i<REHAB_CHECKS.length;i++){
      var c = REHAB_CHECKS[i];
      var done = !!r[c.k];
      html += '<div class="workout-row' + (done?' done':'') + '" onclick="toggleRehab(\'' + c.k + '\')">';
      html += '<div class="checkbox' + (done?' done':'') + '"></div>';
      html += '<div class="workout-content"><div><span class="workout-name">' + c.label + '</span></div>';
      html += '<div class="workout-detail">' + c.detail + '</div></div></div>';
    }
    html += '<div class="tip tip-coral" style="margin-top:10px">⚠️ 그립·당기기 운동(로우·풀업·데드리프트)은 <strong>통증 없이 쥘 수 있을 때까지</strong> 미루세요. 복귀 시점은 반드시 의료진과 확인하세요.</div>';
    html += '</div>';
    document.getElementById('rehab-card-inner').innerHTML = html;
    return;
  }

  card.style.display = 'none';
}

function renderRoutine() {
  var routine = getRoutineForDate(currentDate);
  var phase = getEffectivePhase(currentDate);
  var data = store.dates[dateKey(currentDate)] || {};
  document.getElementById('routine-title').textContent = '🏋️ ' + routine.name;
  document.getElementById('routine-sub').textContent = routine.sub;
  var badge = document.getElementById('routine-badge');
  var badgeText = { A: 'A루틴', B: 'B루틴', M: '모빌리티', S: '회복' };
  badge.textContent = badgeText[routine.type];
  badge.className = 'routine-badge ' + routine.type;

  // 루틴 선택 버튼 상태 (현재 국면의 루틴 이름으로)
  var rec = getRecommendedRoutine(currentDate);
  var typeName = { A:'A · 파워', B:'B · 근력', M:'모빌리티', S:'회복' };
  var recEl = document.getElementById('rec-routine');
  if (recEl) recEl.textContent = typeName[rec.type];
  var labelEl = document.getElementById('routine-picker-label');
  if (data.routineType && data.routineType !== rec.type) {
    labelEl.innerHTML = '오늘 추천: <strong>' + typeName[rec.type] + '</strong> · 직접 <strong>' + typeName[routine.type] + '</strong> 선택함';
  } else {
    labelEl.innerHTML = phase.name + ' · 오늘 추천 <strong>' + typeName[rec.type] + '</strong> (바꿀 수 있어요)';
  }
  var types = ['A', 'B', 'M', 'S'];
  for (var ti = 0; ti < types.length; ti++) {
    var rb = document.getElementById('rp-' + types[ti]);
    if (rb) {
      if (routine.type === types[ti]) rb.classList.add('on');
      else rb.classList.remove('on');
    }
  }

  var gripGate = (phase.key === 'rebuild' && !rehabAllClear());
  var html = '';
  for (var i = 0; i < routine.items.length; i++) {
    var item = routine.items[i];
    var done = !!data[item.k];
    var warn = (gripGate && item.grip);
    html += '<div class="workout-row' + (done ? ' done' : '') + (warn ? ' grip-warn' : '') + '" onclick="toggleItem(\'' + item.k + '\')">';
    html += '<div class="checkbox' + (done ? ' done' : '') + '"></div>';
    html += '<div class="workout-content">';
    html += '<div><span class="workout-num">' + (i+1) + '</span>';
    html += '<span class="workout-name">' + item.name + '</span>';
    html += '<span class="workout-target ' + routine.type + '">' + item.target + '</span>';
    if (warn) html += '<span class="grip-badge">✋ 그립 주의</span>';
    html += '</div>';
    html += '<div class="workout-detail">' + item.detail + (warn ? ' <strong style="color:var(--c-coral)">— 재활 체크포인트 통과 전까지 무리한 그립 금지</strong>' : '') + '</div>';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('routine-items').innerHTML = html;
}

function renderWarmup() {
  var card = document.getElementById('warmup-card');
  if (!card) return;
  if (!hasWarmup(currentDate)) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  var items = getWarmupItems(currentDate);
  var data = store.dates[dateKey(currentDate)] || {};
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var done = !!data[item.k];
    html += '<div class="workout-row' + (done ? ' done' : '') + '" onclick="toggleItem(\'' + item.k + '\')">';
    html += '<div class="checkbox' + (done ? ' done' : '') + '"></div>';
    html += '<div class="workout-content">';
    html += '<div><span class="workout-num">' + (i+1) + '</span>';
    html += '<span class="workout-name">' + item.name + '</span>';
    html += '<span class="workout-target W">' + item.target + '</span></div>';
    html += '<div class="workout-detail">' + item.detail + '</div>';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('warmup-items').innerHTML = html;
}

function renderCooldown() {
  var card = document.getElementById('cooldown-card');
  if (!hasCooldown(currentDate)) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  var items = getCooldownItems(currentDate);
  var data = store.dates[dateKey(currentDate)] || {};
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var done = !!data[item.k];
    html += '<div class="workout-row' + (done ? ' done' : '') + '" onclick="toggleItem(\'' + item.k + '\')">';
    html += '<div class="checkbox' + (done ? ' done' : '') + '"></div>';
    html += '<div class="workout-content">';
    html += '<div><span class="workout-num">' + (i+1) + '</span>';
    html += '<span class="workout-name">' + item.name + '</span>';
    html += '<span class="workout-target C">' + item.target + '</span></div>';
    html += '<div class="workout-detail">' + item.detail + '</div>';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('cooldown-items').innerHTML = html;
}

function updateProgress() {
  var data = store.dates[dateKey(currentDate)] || {};
  var routine = getRoutineForDate(currentDate);
  var routineDone = getRoutineDone(data, routine);
  var routineTotal = routine.items.length;
  var totalDone = routineDone;
  var totalSlots = routineTotal;
  if (hasWarmup(currentDate)) {
    totalDone += getWarmupDone(data, currentDate);
    totalSlots += getWarmupItems(currentDate).length;
  }
  if (hasCooldown(currentDate)) {
    totalDone += getCooldownDone(data, currentDate);
    totalSlots += getCooldownItems(currentDate).length;
  }
  var pct = totalSlots ? Math.round(totalDone / totalSlots * 100) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-text').textContent = totalDone + '/' + totalSlots + ' 항목 완료';
}

// 국면 컨트롤 (오늘은 가볍게 + 수동 국면 선택)
function renderPhaseControls() {
  var wrap = document.getElementById('phase-controls');
  if (!wrap) return;
  var data = store.dates[dateKey(currentDate)] || {};
  var autoPhase = getPhaseForDate(currentDate);
  var manual = getManualPhase();
  var isEasy = !!data.easy;

  var html = '';
  // 오늘은 가볍게 토글
  html += '<button class="phase-ctrl-btn' + (isEasy ? ' on' : '') + '" onclick="toggleEasy()">'
       + (isEasy ? '😌 오늘은 가볍게 (해제)' : '😌 오늘은 가볍게') + '</button>';
  // 수동 국면 선택 드롭다운
  html += '<div class="phase-select-row">';
  html += '<span class="phase-select-lbl">국면 수동 지정:</span>';
  html += '<select class="phase-select" onchange="pickPhase(this.value)">';
  html += '<option value="">자동 (날짜 기준: ' + autoPhase.name + ')</option>';
  for (var i=0;i<PHASES.length;i++){
    var sel = (manual===PHASES[i].key) ? ' selected' : '';
    html += '<option value="'+PHASES[i].key+'"'+sel+'>'+PHASES[i].id+' '+PHASES[i].name+'</option>';
  }
  html += '</select>';
  html += '</div>';
  if (manual) {
    html += '<div class="phase-manual-note">수동 국면 유지 중 · <a href="#" onclick="clearManualPhase();return false;">자동으로 복귀</a></div>';
  }
  wrap.innerHTML = html;
}

function toggleEasy() {
  var data = getDayData();
  data.easy = !data.easy;
  saveStore(store);
  render();
}
function pickPhase(key) {
  setManualPhase(key || null);
  render();
}
function clearManualPhase() {
  setManualPhase(null);
  render();
}

function updateSummary() {
  // 오늘 달성률
  var pct = getDayPct(currentDate);
  document.getElementById('sum-today').textContent = pct + '%';

  // 7일 운동한 날
  var t = todayDate();
  var weekCount = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    if (hasActivity(d)) weekCount++;
  }
  document.getElementById('sum-week').textContent = weekCount;

  // 연속 일수
  var streak = 0;
  var d = todayDate();
  while (true) {
    if (hasActivity(d)) {
      streak++;
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
      if (d < PLAN_START) break;
    } else {
      break;
    }
  }
  document.getElementById('sum-streak').textContent = streak;
}

// ═══════════════════════════════════════════
// 날짜 이동
// ═══════════════════════════════════════════
function changeDate(delta) {
  var d = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + delta);
  var t = todayDate();
  var min = PLAN_START;
  var max = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  if (d < min) return;
  if (d > max) return;
  currentDate = d;
  render();
}

// ═══════════════════════════════════════════
// 뷰 전환
// ═══════════════════════════════════════════
function switchView(v) {
  if (v === 'day') {
    document.getElementById('view-day').style.display = '';
    document.getElementById('view-week').style.display = 'none';
    document.getElementById('view-day-btn').classList.add('on');
    document.getElementById('view-week-btn').classList.remove('on');
  } else {
    document.getElementById('view-day').style.display = 'none';
    document.getElementById('view-week').style.display = '';
    document.getElementById('view-day-btn').classList.remove('on');
    document.getElementById('view-week-btn').classList.add('on');
    renderWeekly();
  }
  window.scrollTo(0, 0);
}

function renderWeekly() {
  var t = todayDate();
  var weekDays = ['일','월','화','수','목','금','토'];
  var typeLabel = { A: 'A루틴', B: 'B루틴', M: '회복', S: '일요' };

  var html = '';
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var pct = getDayPct(d);
    var routine = getRoutineForDate(d);
    var label = '';
    if (i === 0) label = '오늘';
    else if (i === 1) label = '어제';
    else label = (d.getMonth()+1) + '/' + d.getDate() + ' ' + weekDays[d.getDay()];

    html += '<div class="weekly-row">';
    html += '<div class="weekly-day">' + label + '</div>';
    html += '<div class="weekly-bar-track">';
    if (pct > 0) html += '<div class="weekly-bar-fill" style="width:' + pct + '%"></div>';
    html += '</div>';
    html += '<div class="weekly-label">' + typeLabel[routine.type] + '</div>';
    html += '<div class="weekly-pct">' + pct + '%</div>';
    html += '</div>';
  }
  document.getElementById('weekly-list').innerHTML = html;

  // 30일 통계
  var trackedDays = 0;
  var activeDays = 0;
  var typeCounts = { A: 0, B: 0, M: 0, S: 0 };
  var addonCounts = { cardio: 0, stretch: 0, korfball: 0, rest: 0, recovery: 0 };
  var totalPct = 0;

  for (var i = 0; i < 30; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    if (d < PLAN_START) break;
    var data = store.dates[dateKey(d)];
    if (!data) continue;
    trackedDays++;
    if (hasActivity(d)) {
      activeDays++;
      var routine = getRoutineForDate(d);
      var routineDone = getRoutineDone(data, routine);
      if (routineDone > 0) typeCounts[routine.type]++;
    }
    for (var j = 0; j < ADDON_KEYS.length; j++) {
      if (data[ADDON_KEYS[j]]) addonCounts[ADDON_KEYS[j]]++;
    }
    totalPct += getDayPct(d);
  }
  var avgPct = trackedDays ? Math.round(totalPct / trackedDays) : 0;

  var statsHtml = '';
  if (trackedDays === 0) {
    statsHtml = '<div class="empty-state">아직 기록이 없어요</div>';
  } else {
    statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">운동한 날</div><div class="weekly-pct" style="width:auto;font-size:14px">' + activeDays + '/' + trackedDays + '일</div></div>';
    statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">평균 달성률</div><div class="weekly-pct" style="width:auto;font-size:14px">' + avgPct + '%</div></div>';
    if (typeCounts.A) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">A루틴 (폭발력)</div><div class="weekly-pct" style="width:auto;font-size:14px">' + typeCounts.A + '회</div></div>';
    if (typeCounts.B) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">B루틴 (근력)</div><div class="weekly-pct" style="width:auto;font-size:14px">' + typeCounts.B + '회</div></div>';
    if (typeCounts.M) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">모빌리티 (수·토)</div><div class="weekly-pct" style="width:auto;font-size:14px">' + typeCounts.M + '회</div></div>';
    if (addonCounts.korfball) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🏆 코프볼 훈련</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.korfball + '회</div></div>';
    if (addonCounts.cardio) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🏃‍♂️ 유산소</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.cardio + '회</div></div>';
    if (addonCounts.stretch) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🧘 스트레칭</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.stretch + '회</div></div>';
    if (addonCounts.rest) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🛌 휴식</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.rest + '회</div></div>';
    if (addonCounts.recovery) statsHtml += '<div class="weekly-row"><div class="weekly-day" style="width:auto;flex:1">🩹 회복 루틴</div><div class="weekly-pct" style="width:auto;font-size:14px">' + addonCounts.recovery + '회</div></div>';
  }
  document.getElementById('month-stats').innerHTML = statsHtml;
}

function goHome() {
  window.location.href = 'index.html';
}

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
render();

</script>
