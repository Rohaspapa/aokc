<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동 기록">
<meta name="theme-color" content="#0F4C36">
<title>운동 기록 — AOKC 2026</title>
<style>
:root {
  --c-bg: #F5F2EA;
  --c-surface: #FFFFFF;
  --c-surface-2: #FAF8F2;
  --c-border: #E0DCCF;
  --c-text: #1A1916;
  --c-muted: #7A7468;
  --c-accent: #0F4C36;
  --c-accent-2: #1D6B47;
  --c-accent-light: #DCE9E1;
  --c-amber: #B57318;
  --c-amber-light: #F8EBCF;
  --c-coral: #B8412A;
  --c-coral-light: #F8E2DA;
  --c-blue: #1A5CA0;
  --c-blue-light: #DEEAF7;
  --c-purple: #5C3DAF;
  --c-purple-light: #E8E2F5;
  --c-good: #2D7A4E;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  padding-bottom: calc(20px + var(--safe-bottom));
}

/* 헤더 */
.header {
  background: -webkit-linear-gradient(180deg, #0F4C36 0%, #1D6B47 100%);
  background: linear-gradient(180deg, #0F4C36 0%, #1D6B47 100%);
  color: #fff;
  padding: 16px 18px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-row {
  display: -webkit-flex;
  display: flex;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-align-items: center;
  align-items: center;
}
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.back-btn {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.content { padding: 14px; }

/* 토글 */
.toggle-section {
  display: -webkit-flex;
  display: flex;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 12px;
}
.toggle-btn {
  -webkit-flex: 1;
  flex: 1;
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--c-muted);
  cursor: pointer;
  font-family: inherit;
}
.toggle-btn.on {
  background: var(--c-surface);
  color: var(--c-text);
  -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* 날짜 바 */
.date-bar {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.date-btn {
  background: var(--c-accent-light);
  color: var(--c-accent);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.date-text { font-size: 14px; font-weight: 700; }
.date-text .sub {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--c-muted);
  margin-top: 2px;
}

/* 추천 배너 */
.suggestion-banner {
  background: -webkit-linear-gradient(135deg, var(--c-amber-light), #F8E0BA);
  background: linear-gradient(135deg, var(--c-amber-light), #F8E0BA);
  border: 1px solid #E8D4A0;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.suggestion-label {
  font-size: 10px;
  font-weight: 700;
  color: #6B5510;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.suggestion-text {
  font-size: 13px;
  font-weight: 600;
  color: #3D2F08;
  line-height: 1.5;
}
.suggestion-sub {
  font-size: 11px;
  color: #6B5510;
  margin-top: 4px;
  font-style: italic;
}

/* 카드 */
.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 10px;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  gap: 6px;
}
.card-title-text {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 6px;
}
.card-sub {
  font-size: 11px;
  color: var(--c-muted);
  margin-top: -6px;
  margin-bottom: 10px;
}

/* 운동 옵션 그리드 */
.option-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.option-grid.three {
  grid-template-columns: repeat(3, 1fr);
}
.option-btn {
  background: var(--c-surface-2);
  border: 1.5px solid var(--c-border);
  padding: 14px 8px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.option-btn:active { -webkit-transform: scale(0.97); transform: scale(0.97); }
.option-btn.on {
  background: var(--c-accent-light);
  border-color: var(--c-accent);
}
.option-btn.on .opt-check { display: -webkit-inline-flex; display: inline-flex; }
.option-icon {
  font-size: 22px;
  display: block;
  margin-bottom: 4px;
}
.option-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-text);
}
.option-sub {
  font-size: 10px;
  color: var(--c-muted);
  margin-top: 2px;
}
.opt-check {
  display: none;
  width: 18px;
  height: 18px;
  background: var(--c-accent);
  color: #fff;
  border-radius: 50%;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  margin-top: 6px;
  margin-left: auto;
  margin-right: auto;
}

/* 메모 입력 */
.memo-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--c-border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  resize: vertical;
  min-height: 60px;
}
.memo-input:focus { outline: none; border-color: var(--c-accent); }

/* 요약 카드 */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.summary-box {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.summary-num {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--c-accent);
}
.summary-num.gold { color: #B8923A; }
.summary-num.coral { color: var(--c-coral); }
.summary-lbl {
  font-size: 10px;
  color: var(--c-muted);
  margin-top: 4px;
  font-weight: 600;
}

/* 통계 페이즈 페이지 */
.stat-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--c-border);
  font-size: 13px;
}
.stat-row:last-child { border-bottom: none; }
.stat-label {
  -webkit-flex: 1;
  flex: 1;
  font-weight: 500;
}
.stat-count {
  font-weight: 800;
  font-size: 16px;
  color: var(--c-accent);
}
.stat-count .of { font-size: 11px; font-weight: 500; color: var(--c-muted); }

/* 주간 요약 */
.weekly-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
}
.weekly-day {
  width: 56px;
  font-weight: 600;
  color: var(--c-muted);
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.weekly-icons {
  -webkit-flex: 1;
  flex: 1;
  display: -webkit-flex;
  display: flex;
  gap: 6px;
  -webkit-align-items: center;
  align-items: center;
}
.w-icon {
  font-size: 14px;
}
.w-icon.dim { opacity: 0.2; }
.weekly-empty {
  color: var(--c-muted);
  font-size: 11px;
  font-style: italic;
}

/* 빈 상태 */
.empty-state {
  text-align: center;
  padding: 24px 16px;
  color: var(--c-muted);
  font-size: 12.5px;
  line-height: 1.6;
}

.btn-secondary {
  width: 100%;
  background: transparent;
  border: 1px solid var(--c-border);
  padding: 11px;
  border-radius: 10px;
  color: var(--c-muted);
  font-size: 13px;
  font-weight: 500;
  margin-top: 6px;
  cursor: pointer;
  font-family: inherit;
}

</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>🏋️ 운동 기록</h1>
      <p>오늘 한 운동을 빠르게 체크</p>
    </div>
    <button class="back-btn" onclick="goHome()">← 메인</button>
  </div>
</div>

<div class="content">

  <!-- 일/주간 토글 -->
  <div class="toggle-section">
    <button class="toggle-btn on" id="view-day-btn" onclick="switchView('day')">📅 오늘</button>
    <button class="toggle-btn" id="view-week-btn" onclick="switchView('week')">📊 주간</button>
  </div>

  <!-- ════ 일별 뷰 ════ -->
  <div id="view-day">

    <!-- 날짜 바 -->
    <div class="date-bar">
      <button class="date-btn" onclick="changeDate(-1)">‹</button>
      <div class="date-text" id="date-text">오늘
        <span class="sub" id="date-sub"></span>
      </div>
      <button class="date-btn" onclick="changeDate(1)">›</button>
    </div>

    <!-- 추천 -->
    <div class="suggestion-banner" id="suggestion-banner" style="display:none">
      <div class="suggestion-label">💡 오늘의 계획</div>
      <div class="suggestion-text" id="suggestion-text"></div>
      <div class="suggestion-sub">참고용 — 실제 한 운동만 아래에서 체크하세요</div>
    </div>

    <!-- 오늘 요약 -->
    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-num" id="sum-today">0</div>
        <div class="summary-lbl">오늘 완료</div>
      </div>
      <div class="summary-box">
        <div class="summary-num gold" id="sum-streak">0</div>
        <div class="summary-lbl">연속 일수</div>
      </div>
      <div class="summary-box">
        <div class="summary-num" id="sum-week">0</div>
        <div class="summary-lbl">7일 운동</div>
      </div>
    </div>

    <!-- 운동 장소 (복합 운동) -->
    <div class="card">
      <div class="card-title">
        <div class="card-title-text">🏟️ 장소별 운동</div>
      </div>
      <div class="card-sub">한 가지 또는 여러 개 선택 가능</div>
      <div class="option-grid three">
        <button class="option-btn" id="opt-gym" onclick="toggleOpt('gym')">
          <span class="option-icon">🏋️</span>
          <div class="option-label">헬스장</div>
          <div class="option-sub">기능성 근력</div>
          <div class="opt-check">✓</div>
        </button>
        <button class="option-btn" id="opt-field" onclick="toggleOpt('field')">
          <span class="option-icon">🏃</span>
          <div class="option-label">운동장</div>
          <div class="option-sub">민첩성·드릴</div>
          <div class="opt-check">✓</div>
        </button>
        <button class="option-btn" id="opt-home" onclick="toggleOpt('home')">
          <span class="option-icon">🏠</span>
          <div class="option-label">집</div>
          <div class="option-sub">맨몸·서킷</div>
          <div class="opt-check">✓</div>
        </button>
      </div>
    </div>

    <!-- 단일 운동 -->
    <div class="card">
      <div class="card-title">
        <div class="card-title-text">🚴 단일 운동</div>
      </div>
      <div class="card-sub">유산소나 스트레칭만 한 날에도 체크</div>
      <div class="option-grid three">
        <button class="option-btn" id="opt-running" onclick="toggleOpt('running')">
          <span class="option-icon">🏃‍♂️</span>
          <div class="option-label">러닝</div>
          <div class="option-sub">유산소</div>
          <div class="opt-check">✓</div>
        </button>
        <button class="option-btn" id="opt-cycling" onclick="toggleOpt('cycling')">
          <span class="option-icon">🚴</span>
          <div class="option-label">자전거</div>
          <div class="option-sub">유산소</div>
          <div class="opt-check">✓</div>
        </button>
        <button class="option-btn" id="opt-stretch" onclick="toggleOpt('stretch')">
          <span class="option-icon">🧘</span>
          <div class="option-label">스트레칭</div>
          <div class="option-sub">회복·유연</div>
          <div class="opt-check">✓</div>
        </button>
      </div>
    </div>

    <!-- 코프볼 단체훈련 -->
    <div class="card">
      <div class="card-title">
        <div class="card-title-text">⛹️ 코프볼 단체훈련</div>
      </div>
      <div class="card-sub">일요일 정기 훈련 또는 자체 연습</div>
      <button class="option-btn" id="opt-korfball" onclick="toggleOpt('korfball')" style="width:100%">
        <span class="option-icon">🏆</span>
        <div class="option-label">코프볼 훈련 완료</div>
        <div class="option-sub">실전 시뮬레이션</div>
        <div class="opt-check">✓</div>
      </button>
    </div>

    <!-- 휴식 -->
    <div class="card">
      <div class="card-title">
        <div class="card-title-text">😴 의도적 휴식</div>
      </div>
      <div class="card-sub">오늘은 회복일이라면 (체크해도 연속 일수 유지)</div>
      <button class="option-btn" id="opt-rest" onclick="toggleOpt('rest')" style="width:100%">
        <span class="option-icon">🛌</span>
        <div class="option-label">완전 휴식</div>
        <div class="option-sub">근육 회복에 필수</div>
        <div class="opt-check">✓</div>
      </button>
    </div>

    <!-- 메모 -->
    <div class="card">
      <div class="card-title">
        <div class="card-title-text">📝 메모 (선택)</div>
      </div>
      <textarea class="memo-input" id="memo-input" placeholder="컨디션·통증·특이사항 (예: 오른쪽 무릎 약간 뻣뻣함, 컨디션 좋음)" oninput="saveMemo()"></textarea>
    </div>

    <button class="btn-secondary" onclick="resetToday()">오늘 기록 초기화</button>

  </div>

  <!-- ════ 주간 뷰 ════ -->
  <div id="view-week" style="display:none">

    <div class="card">
      <div class="card-title"><div class="card-title-text">📊 최근 7일</div></div>
      <div id="weekly-list"></div>
    </div>

    <div class="card">
      <div class="card-title"><div class="card-title-text">📈 30일 통계</div></div>
      <div id="month-stats"></div>
    </div>

  </div>

</div>

<script>
// ═══════════════════════════════════════════
// 운동 옵션 정의
// ═══════════════════════════════════════════
var OPTS = [
  { k: 'gym', icon: '🏋️', label: '헬스장' },
  { k: 'field', icon: '🏃', label: '운동장' },
  { k: 'home', icon: '🏠', label: '집' },
  { k: 'running', icon: '🏃‍♂️', label: '러닝' },
  { k: 'cycling', icon: '🚴', label: '자전거' },
  { k: 'stretch', icon: '🧘', label: '스트레칭' },
  { k: 'korfball', icon: '🏆', label: '코프볼' },
  { k: 'rest', icon: '🛌', label: '휴식' }
];

// 운동 활동으로 인정 (휴식 제외)
var ACTIVE_KEYS = ['gym', 'field', 'home', 'running', 'cycling', 'stretch', 'korfball'];

// 주간 계획표 (메인 대시보드와 동일)
var WEEKLY_PLAN = {
  0: { text: '코프볼 단체훈련', sub: '실전 시뮬레이션 (3시간)' },           // 일
  1: { text: '헬스장 — 기능성 근력', sub: '하체·코어·등 (약 55분)' },     // 월
  2: { text: '운동장 — 민첩성 드릴', sub: '셔틀런·방향전환 (약 50분)' }, // 화
  3: { text: '완전 회복 — 산책·스트레칭', sub: '회복일' },                 // 수
  4: { text: '헬스장 — 기능성 근력', sub: '하체·코어·등 (약 55분)' },     // 목
  5: { text: '운동장 — 민첩성 / 코어', sub: '드릴+코어 보조' },           // 금
  6: { text: '가족 시간 (휴식)', sub: '일요훈련 컨디션 보존' }              // 토
};

var COMP_START = new Date(2026, 11, 6);
var PLAN_START = new Date(2026, 4, 1);

// ═══════════════════════════════════════════
// 저장소
// ═══════════════════════════════════════════
var STORAGE_KEY = 'aokc2026_workout';

function loadStore() {
  try {
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { dates: {} };
  // dates: { '2026-05-08': { gym: true, stretch: true, memo: '...' } }
}
function saveStore(s) {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
}
var store = loadStore();

// ═══════════════════════════════════════════
// 날짜 헬퍼
// ═══════════════════════════════════════════
function dateKey(d) {
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}
function todayDate() {
  var t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

var currentDate = todayDate();

function getDayData() {
  var k = dateKey(currentDate);
  if (!store.dates[k]) store.dates[k] = {};
  return store.dates[k];
}

// ═══════════════════════════════════════════
// 토글
// ═══════════════════════════════════════════
function toggleOpt(key) {
  var data = getDayData();
  data[key] = !data[key];
  saveStore(store);
  render();
}

function saveMemo() {
  var data = getDayData();
  data.memo = document.getElementById('memo-input').value;
  saveStore(store);
  // 메모 저장은 갱신할 필요 없음 (요약에 영향 없음)
}

function resetToday() {
  if (!window.confirm(dateKey(currentDate) + ' 의 운동 기록을 모두 초기화할까요?')) return;
  delete store.dates[dateKey(currentDate)];
  saveStore(store);
  render();
}

// ═══════════════════════════════════════════
// 렌더
// ═══════════════════════════════════════════
function render() {
  // 날짜 텍스트
  var t = todayDate();
  var weekDays = ['일','월','화','수','목','금','토'];
  var dayText = '';
  if (dateKey(currentDate) === dateKey(t)) dayText = '오늘';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()-1))) dayText = '어제';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()+1))) dayText = '내일';
  else dayText = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일';
  document.getElementById('date-text').firstChild.nodeValue = dayText;
  document.getElementById('date-sub').textContent = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일 (' + weekDays[currentDate.getDay()] + ')';

  // 추천 배너
  var dow = currentDate.getDay();
  var plan = WEEKLY_PLAN[dow];
  var banner = document.getElementById('suggestion-banner');
  if (plan) {
    banner.style.display = '';
    document.getElementById('suggestion-text').textContent = plan.text;
  } else {
    banner.style.display = 'none';
  }

  // 옵션 상태
  var data = store.dates[dateKey(currentDate)] || {};
  for (var i = 0; i < OPTS.length; i++) {
    var k = OPTS[i].k;
    var btn = document.getElementById('opt-' + k);
    if (btn) {
      if (data[k]) btn.classList.add('on');
      else btn.classList.remove('on');
    }
  }

  // 메모
  document.getElementById('memo-input').value = data.memo || '';

  // 요약
  var todayCount = 0;
  for (var i = 0; i < ACTIVE_KEYS.length; i++) {
    if (data[ACTIVE_KEYS[i]]) todayCount++;
  }
  document.getElementById('sum-today').textContent = todayCount;

  // 7일 운동 횟수
  var weekCount = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var dd = store.dates[dateKey(d)] || {};
    var hasActivity = false;
    for (var j = 0; j < ACTIVE_KEYS.length; j++) {
      if (dd[ACTIVE_KEYS[j]]) { hasActivity = true; break; }
    }
    if (hasActivity) weekCount++;
  }
  document.getElementById('sum-week').textContent = weekCount;

  // 연속 일수 (운동 또는 의도적 휴식)
  var streak = 0;
  var d = todayDate();
  while (true) {
    var dd = store.dates[dateKey(d)] || {};
    var hasActivity = false;
    for (var j = 0; j < ACTIVE_KEYS.length; j++) {
      if (dd[ACTIVE_KEYS[j]]) { hasActivity = true; break; }
    }
    var hasRest = !!dd.rest;
    if (hasActivity || hasRest) {
      streak++;
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
      if (d < PLAN_START) break;
    } else {
      break;
    }
  }
  document.getElementById('sum-streak').textContent = streak;
}

// ═══════════════════════════════════════════
// 날짜 이동
// ═══════════════════════════════════════════
function changeDate(delta) {
  var d = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + delta);
  var t = todayDate();
  var min = PLAN_START;
  var max = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  if (d < min) return;
  if (d > max) return;
  currentDate = d;
  render();
}

// ═══════════════════════════════════════════
// 뷰 전환
// ═══════════════════════════════════════════
function switchView(v) {
  if (v === 'day') {
    document.getElementById('view-day').style.display = '';
    document.getElementById('view-week').style.display = 'none';
    document.getElementById('view-day-btn').classList.add('on');
    document.getElementById('view-week-btn').classList.remove('on');
  } else {
    document.getElementById('view-day').style.display = 'none';
    document.getElementById('view-week').style.display = '';
    document.getElementById('view-day-btn').classList.remove('on');
    document.getElementById('view-week-btn').classList.add('on');
    renderWeekly();
  }
  window.scrollTo(0, 0);
}

function renderWeekly() {
  var t = todayDate();
  var weekDays = ['일','월','화','수','목','금','토'];

  // 7일 (오늘부터 6일 전까지, 최신이 위)
  var html = '';
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var data = store.dates[dateKey(d)] || {};
    var label = '';
    if (i === 0) label = '오늘';
    else if (i === 1) label = '어제';
    else label = (d.getMonth()+1) + '/' + d.getDate() + ' ' + weekDays[d.getDay()];

    var iconsHtml = '';
    var doneAny = false;
    for (var j = 0; j < OPTS.length; j++) {
      var k = OPTS[j].k;
      if (data[k]) {
        iconsHtml += '<span class="w-icon" title="' + OPTS[j].label + '">' + OPTS[j].icon + '</span>';
        doneAny = true;
      }
    }
    if (!doneAny) {
      iconsHtml = '<span class="weekly-empty">기록 없음</span>';
    }

    html += '<div class="weekly-row">';
    html += '<div class="weekly-day">' + label + '</div>';
    html += '<div class="weekly-icons">' + iconsHtml + '</div>';
    html += '</div>';
  }
  document.getElementById('weekly-list').innerHTML = html;

  // 30일 통계
  var stats = {};
  for (var i = 0; i < OPTS.length; i++) stats[OPTS[i].k] = 0;
  var trackedDays = 0;
  var activeDays = 0;
  for (var i = 0; i < 30; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    if (d < PLAN_START) break;
    var data = store.dates[dateKey(d)];
    if (!data) continue;
    trackedDays++;
    var hasActivity = false;
    for (var j = 0; j < OPTS.length; j++) {
      if (data[OPTS[j].k]) {
        stats[OPTS[j].k]++;
        if (ACTIVE_KEYS.indexOf(OPTS[j].k) >= 0) hasActivity = true;
      }
    }
    if (hasActivity) activeDays++;
  }

  var statsHtml = '<div class="stat-row"><div class="stat-label">📅 운동한 날</div><div class="stat-count">' + activeDays + '<span class="of"> / ' + Math.min(30, trackedDays || 1) + '일</span></div></div>';
  for (var i = 0; i < OPTS.length; i++) {
    var o = OPTS[i];
    if (stats[o.k] === 0) continue;
    statsHtml += '<div class="stat-row"><div class="stat-label">' + o.icon + ' ' + o.label + '</div><div class="stat-count">' + stats[o.k] + '<span class="of">회</span></div></div>';
  }
  if (trackedDays === 0) {
    statsHtml = '<div class="empty-state">아직 기록이 없어요</div>';
  }
  document.getElementById('month-stats').innerHTML = statsHtml;
}

function goHome() {
  window.location.href = 'index.html';
}

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
render();

</script>
