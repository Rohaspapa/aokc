<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동 기록">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon" sizes="360x360" href="icon-360.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#B8412A">
<title>운동 기록 — AOKC 2026</title>
<style>
:root {
  --c-bg: #F5F2EA;
  --c-surface: #FFFFFF;
  --c-surface-2: #FAF8F2;
  --c-border: #E0DCCF;
  --c-text: #1A1916;
  --c-muted: #7A7468;
  --c-accent: #0F4C36;
  --c-accent-2: #1D6B47;
  --c-accent-light: #DCE9E1;
  --c-amber: #B57318;
  --c-amber-light: #F8EBCF;
  --c-coral: #B8412A;
  --c-coral-2: #D45438;
  --c-coral-light: #F8E2DA;
  --c-blue: #1A5CA0;
  --c-blue-light: #DEEAF7;
  --c-purple: #5C3DAF;
  --c-purple-light: #E8E2F5;
  --c-good: #2D7A4E;
  /* 구 코드 호환 별칭 — 예전 클래스들이 참조하던 이름 */
  --c-line: #E0DCCF;
  --c-ink: #1A1916;
  --c-ink-soft: #7A7468;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  padding-bottom: calc(20px + var(--safe-bottom));
}

/* 헤더 */
.header {
  background: -webkit-linear-gradient(180deg, #B8412A 0%, #D45438 100%);
  background: linear-gradient(180deg, #B8412A 0%, #D45438 100%);
  color: #fff;
  padding: 16px 18px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-row {
  display: -webkit-flex;
  display: flex;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-align-items: center;
  align-items: center;
}
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.back-btn {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.content { padding: 14px; }

/* 토글 */
.toggle-section {
  display: -webkit-flex;
  display: flex;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 12px;
}
.toggle-btn {
  -webkit-flex: 1;
  flex: 1;
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--c-muted);
  cursor: pointer;
  font-family: inherit;
}
.toggle-btn.on {
  background: var(--c-surface);
  color: var(--c-text);
  -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* 날짜 바 */
.date-bar {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.date-btn {
  background: var(--c-coral-light);
  color: var(--c-coral);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.date-text { font-size: 14px; font-weight: 700; }
.date-text .sub {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--c-muted);
  margin-top: 2px;
}

/* 루틴 배지 */
.routine-badge {
  display: -webkit-inline-flex;
  display: inline-flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.2px;
  white-space: nowrap;
}
.routine-badge.A { background: var(--c-coral-light); color: var(--c-coral); }
.routine-badge.B { background: var(--c-blue-light); color: var(--c-blue); }
.routine-badge.R { background: var(--c-accent-light); color: var(--c-accent); }
.routine-badge.K { background: var(--c-purple-light); color: var(--c-purple); }
.routine-badge.S { background: var(--c-amber-light); color: #6B5510; }
.routine-badge.W { background: #fdf0d5; color: #a0741c; }

/* 주간 구조 카드 */
.weekmap {
  display: -webkit-flex;
  display: flex;
  gap: 4px;
  margin-top: 10px;
}
.wm-day {
  -webkit-flex: 1;
  flex: 1;
  text-align: center;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 8px;
  padding: 6px 2px;
}
.wm-day.today { border-color: var(--c-coral); border-width: 2px; background: #fff; }
.wm-dow { font-size: 10px; font-weight: 700; color: var(--c-muted); }
.wm-type {
  font-size: 11px;
  font-weight: 800;
  margin-top: 3px;
  line-height: 1.15;
}
.wm-type.A { color: var(--c-coral); }
.wm-type.B { color: var(--c-blue); }
.wm-type.R { color: var(--c-accent); }
.wm-type.K { color: var(--c-purple); }
.wm-type.S { color: var(--c-amber); }
.wm-min { font-size: 8.5px; color: var(--c-muted); margin-top: 2px; }

/* 루틴 선택기 */
.routine-picker {
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 12px;
}
.routine-picker-label {
  font-size: 11px;
  color: var(--c-muted);
  margin-bottom: 8px;
  line-height: 1.4;
}
.routine-picker-label strong { color: var(--c-coral); font-weight: 700; }
.routine-picker-btns {
  display: -webkit-flex;
  display: flex;
  gap: 5px;
}
.rp-btn {
  -webkit-flex: 1;
  flex: 1;
  padding: 8px 2px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.25;
  background: var(--c-surface);
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  color: var(--c-muted);
  cursor: pointer;
  font-family: inherit;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
}
.rp-btn:active { -webkit-transform: scale(0.96); transform: scale(0.96); }
.rp-btn.on { background: var(--c-coral); border-color: var(--c-coral); color: #fff; }

/* 진행 바 */
.progress-wrap {
  background: var(--c-border);
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 4px;
}
.progress-fill {
  height: 100%;
  background: -webkit-linear-gradient(left, var(--c-coral), var(--c-coral-2));
  background: linear-gradient(90deg, var(--c-coral), var(--c-coral-2));
  -webkit-transition: width 0.3s;
  transition: width 0.3s;
  border-radius: 4px;
}
.progress-text {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--c-coral);
  margin-bottom: 14px;
}

/* 카드 */
.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  gap: 6px;
}
.card-title-text {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 6px;
}
.card-sub {
  font-size: 11px;
  color: var(--c-muted);
  margin-top: -4px;
  margin-bottom: 10px;
  line-height: 1.5;
}

/* 운동 체크 항목 */
.workout-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: flex-start;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.workout-row:last-child { border-bottom: none; }
.checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--c-muted);
  border-radius: 6px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  margin-right: 11px;
  margin-top: 1px;
  position: relative;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
  background: #fff;
}
.checkbox.done { background: var(--c-coral); border-color: var(--c-coral); }
.checkbox.done:after {
  content: '';
  position: absolute;
  left: 5px;
  top: 1px;
  width: 6px;
  height: 11px;
  border: solid #fff;
  border-width: 0 2.5px 2.5px 0;
  -webkit-transform: rotate(45deg);
  transform: rotate(45deg);
}
.workout-content { -webkit-flex: 1; flex: 1; }
.workout-num {
  display: inline-block;
  width: 18px;
  height: 18px;
  background: var(--c-surface-2);
  color: var(--c-muted);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  line-height: 18px;
  border-radius: 4px;
  margin-right: 6px;
  vertical-align: middle;
}
.workout-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
  line-height: 1.4;
  display: inline;
}
.workout-row.done .workout-name { color: var(--c-muted); text-decoration: line-through; }
.workout-detail {
  font-size: 11px;
  color: var(--c-muted);
  margin-top: 3px;
  margin-left: 24px;
  line-height: 1.45;
}
.workout-target {
  display: inline-block;
  background: var(--c-coral-light);
  color: var(--c-coral);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  margin-left: 4px;
  vertical-align: middle;
}
.workout-target.B { background: var(--c-blue-light); color: var(--c-blue); }
.workout-target.R { background: var(--c-accent-light); color: var(--c-accent); }
.workout-target.K { background: var(--c-purple-light); color: var(--c-purple); }
.workout-target.S { background: var(--c-amber-light); color: #6B5510; }
.workout-target.C { background: var(--c-purple-light); color: var(--c-purple); }
.workout-target.W { background: #fdf0d5; color: #a0741c; }

/* 슈퍼세트 구분선 */
.ss-label {
  font-size: 10px;
  font-weight: 800;
  color: var(--c-blue);
  background: var(--c-blue-light);
  border-radius: 4px;
  padding: 2px 7px;
  display: inline-block;
  margin-right: 5px;
  vertical-align: middle;
}

/* 그립 주의 */
.grip-badge {
  display: inline-block;
  font-size: 9.5px;
  font-weight: 800;
  color: #fff;
  background: var(--c-coral);
  border-radius: 4px;
  padding: 1px 6px;
  margin-left: 6px;
  vertical-align: 1px;
}
.workout-row.grip-warn { background: rgba(184,65,42,0.04); }

/* 재활 카드 */
.rehab-warn-head { font-size: 13.5px; font-weight: 800; color: var(--c-coral); margin-bottom: 8px; }
.rehab-warn-list { margin: 0; padding-left: 18px; }
.rehab-warn-list li { font-size: 12px; color: var(--c-text); line-height: 1.6; margin-bottom: 4px; }
.rehab-warn-list li strong { color: var(--c-coral); }
.rehab-head {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  cursor: pointer;
}
.rehab-title { font-size: 14px; font-weight: 800; color: var(--c-text); }
.rehab-badge-inline {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  color: var(--c-coral);
  background: var(--c-coral-light);
  border-radius: 10px;
  padding: 1px 8px;
  margin-left: 8px;
}
.rehab-caret { font-size: 13px; color: var(--c-muted); }
.tip-coral {
  background: var(--c-coral-light);
  color: #6B1E0E;
  font-size: 11.5px;
  padding: 8px 10px;
  border-radius: 8px;
  line-height: 1.5;
}

/* 국면 컨트롤 */
.phase-controls {
  margin: 10px 0 4px;
  padding: 10px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 10px;
}
.phase-ctrl-btn {
  width: 100%;
  padding: 9px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--c-text);
  cursor: pointer;
  margin-bottom: 8px;
}
.phase-ctrl-btn.on { background: #fdf0d5; border-color: #d9a441; color: #8a5a00; }
.phase-ctrl-btn:active { -webkit-transform: scale(0.98); transform: scale(0.98); }
.phase-select-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 8px;
}
.phase-select-lbl { font-size: 11.5px; color: var(--c-muted); font-weight: 600; white-space: nowrap; }
.phase-select {
  -webkit-flex: 1;
  flex: 1;
  padding: 7px 8px;
  border: 1px solid var(--c-border);
  border-radius: 7px;
  font-family: inherit;
  font-size: 12px;
  background: #fff;
  color: var(--c-text);
}
.phase-manual-note { font-size: 11px; color: var(--c-coral); margin-top: 7px; }
.phase-manual-note a { color: var(--c-blue); font-weight: 600; }

/* 추가 활동 */
.option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.option-btn {
  background: var(--c-surface-2);
  border: 1.5px solid var(--c-border);
  padding: 14px 8px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
  -webkit-transition: all 0.15s;
  transition: all 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.option-btn:active { -webkit-transform: scale(0.97); transform: scale(0.97); }
.option-btn.on { background: var(--c-coral-light); border-color: var(--c-coral); }
.option-btn.on .opt-check { display: -webkit-inline-flex; display: inline-flex; }
.option-icon { font-size: 22px; display: block; margin-bottom: 4px; }
.option-label { font-size: 12px; font-weight: 600; color: var(--c-text); }
.option-sub { font-size: 10px; color: var(--c-muted); margin-top: 2px; }
.opt-check {
  display: none;
  width: 18px;
  height: 18px;
  background: var(--c-coral);
  color: #fff;
  border-radius: 50%;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  margin: 6px auto 0;
}

/* 메모 */
.memo-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--c-border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  resize: vertical;
  min-height: 70px;
  line-height: 1.5;
}
.memo-input:focus { outline: none; border-color: var(--c-coral); }

.save-indicator {
  font-size: 11px;
  font-weight: 600;
  -webkit-transition: opacity 0.3s ease;
  transition: opacity 0.3s ease;
  opacity: 0;
  white-space: nowrap;
}
.save-indicator.show { opacity: 1; }
.save-indicator.saving { color: var(--c-muted); }
.save-indicator.saved { color: var(--c-good); }

/* 요약 */
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.summary-box {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.summary-num { font-size: 22px; font-weight: 800; line-height: 1.1; color: var(--c-coral); }
.summary-num.gold { color: #B8923A; }
.summary-num.small { font-size: 17px; }
.summary-lbl { font-size: 10px; color: var(--c-muted); margin-top: 4px; font-weight: 600; }

/* 주간 뷰 */
.weekly-row {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 12px;
}
.weekly-day {
  width: 60px;
  font-weight: 600;
  color: var(--c-muted);
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  font-size: 11px;
}
.weekly-bar-track {
  -webkit-flex: 1;
  flex: 1;
  height: 18px;
  background: var(--c-surface-2);
  border-radius: 4px;
  overflow: hidden;
}
.weekly-bar-fill {
  height: 100%;
  background: -webkit-linear-gradient(left, var(--c-coral), var(--c-coral-2));
  background: linear-gradient(90deg, var(--c-coral), var(--c-coral-2));
}
.weekly-pct {
  width: 36px;
  text-align: right;
  font-weight: 700;
  font-size: 12px;
  color: var(--c-coral);
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.weekly-label {
  font-size: 10px;
  color: var(--c-muted);
  width: 34px;
  text-align: right;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}

.empty-state { text-align: center; padding: 24px 16px; color: var(--c-muted); font-size: 12.5px; line-height: 1.6; }

.btn-secondary {
  width: 100%;
  background: transparent;
  border: 1px solid var(--c-border);
  padding: 11px;
  border-radius: 10px;
  color: var(--c-muted);
  font-size: 13px;
  font-weight: 500;
  margin-top: 6px;
  cursor: pointer;
  font-family: inherit;
}

/* 정보 박스 */
.info-box {
  background: var(--c-coral-light);
  border: 1px solid #E8B6A8;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 11.5px;
  color: #6B1E0E;
  line-height: 1.5;
  margin-bottom: 12px;
}
.info-box strong { font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>🏋️ 운동 기록</h1>
      <p>주 3회 · 40분 · 코프볼 특이 프로그램</p>
    </div>
    <button class="back-btn" onclick="goHome()">← 메인</button>
  </div>
</div>

<div class="content">

  <div class="toggle-section">
    <button class="toggle-btn on" id="view-day-btn" onclick="switchView('day')">📅 오늘</button>
    <button class="toggle-btn" id="view-week-btn" onclick="switchView('week')">📊 주간</button>
  </div>

  <!-- 일별 -->
  <div id="view-day">

    <div class="date-bar">
      <button class="date-btn" onclick="changeDate(-1)">‹</button>
      <div class="date-text" id="date-text">오늘
        <span class="sub" id="date-sub"></span>
      </div>
      <button class="date-btn" onclick="changeDate(1)">›</button>
    </div>

    <!-- 국면 + 주간 구조 -->
    <div class="info-box" id="today-info"></div>

    <!-- 요약 -->
    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-num" id="sum-today">0%</div>
        <div class="summary-lbl">오늘 달성</div>
      </div>
      <div class="summary-box">
        <div class="summary-num gold small" id="sum-week-goal">0/3</div>

var STORAGE_KEY = 'aokc2026_workout';
var ADDON_KEYS = ['cardio', 'stretch', 'korfball', 'rest', 'recovery'];

function loadStore() {
  try { var raw = window.localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { dates: {} };
}
function saveStore(s) { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {} }
var store = loadStore();

// ═══════════════════════════════════════════
// 날짜 헬퍼
// ═══════════════════════════════════════════
function dateKey(d) {
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}
function todayDate() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function ymdToDate(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

var currentDate = todayDate();

function getDayData() {
  var k = dateKey(currentDate);
  if (!store.dates[k]) store.dates[k] = {};
  return store.dates[k];
}

// ═══════════════════════════════════════════
// 국면 판정
// ═══════════════════════════════════════════
var PHASE_ORDER = ['recovery','rebuild','strength','convert','taper'];
var MANUAL_PHASE_KEY = 'aokc2026_manual_phase';

function getPhaseForDate(d){
  var day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  for(var i=0;i<PHASES.length;i++){
    var ph=PHASES[i];
    if(day>=ymdToDate(ph.from) && day<=ymdToDate(ph.to)) return ph;
  }
  if(day < ymdToDate(PHASES[0].from)) return PHASES[0];
  return PHASES[PHASES.length-1];
}
function getManualPhase(){ try{ return localStorage.getItem(MANUAL_PHASE_KEY) || null; }catch(e){ return null; } }
function setManualPhase(key){
  try{ if(key) localStorage.setItem(MANUAL_PHASE_KEY, key); else localStorage.removeItem(MANUAL_PHASE_KEY); }catch(e){}
}
function phaseByKey(key){ for(var i=0;i<PHASES.length;i++) if(PHASES[i].key===key) return PHASES[i]; return null; }

function getEffectivePhase(d){
  var data = store.dates[dateKey(d)];
  if(data && data.dayPhase && phaseByKey(data.dayPhase)) return phaseByKey(data.dayPhase);
  var manual = getManualPhase();
  if(manual && phaseByKey(manual)) return phaseByKey(manual);
  return getPhaseForDate(d);
}
function easierPhaseKey(key){
  var idx = PHASE_ORDER.indexOf(key);
  if(idx <= 0) return 'recovery';
  return PHASE_ORDER[idx-1];
}

// ═══════════════════════════════════════════
// 루틴 조회
// ═══════════════════════════════════════════
function buildRoutine(phaseKey, type){
  if (type === 'K' || type === 'S') {
    var c = COMMON_ROUTINES[type];
    return { type:type, name:c.name, sub:c.sub, items:c.items };
  }
  var r = PHASE_ROUTINES[phaseKey][type];
  if (!r) { var f = COMMON_ROUTINES.S; return { type:'S', name:f.name, sub:f.sub, items:f.items }; }
  return { type:type, name:r.name, sub:r.sub, items:r.items };
}

function getRoutineForDate(d) {
  var data = store.dates[dateKey(d)] || {};
  var phase = getEffectivePhase(d);
  var phaseKey = phase.key;
  if(data.easy) phaseKey = easierPhaseKey(phaseKey);
  var type = data.routineType || DAY_TYPE[d.getDay()];
  return buildRoutine(phaseKey, type);
}
function getRecommendedRoutine(d) {
  var phase = getEffectivePhase(d);
  return buildRoutine(phase.key, DAY_TYPE[d.getDay()]);
}
function hasWarmup(d) { var r = getRoutineForDate(d); return r.type === 'A' || r.type === 'B'; }
function hasCooldown(d) { return hasWarmup(d); }

function getWarmupItems(d){
  var phase = getEffectivePhase(d);
  var data = store.dates[dateKey(d)] || {};
  var key = phase.key;
  if(data.easy) key = easierPhaseKey(key);
  return PHASE_WARMUP[key] || PHASE_WARMUP.rebuild;
}

// ═══════════════════════════════════════════
// 집계
// ═══════════════════════════════════════════
function countDone(data, items) {
  var n = 0;
  for (var i = 0; i < items.length; i++) if (data[items[i].k]) n++;
  return n;
}
function getDaySlots(d) {
  var data = store.dates[dateKey(d)] || {};
  var routine = getRoutineForDate(d);
  var done = countDone(data, routine.items);
  var total = routine.items.length;
  if (hasWarmup(d)) { var w = getWarmupItems(d); done += countDone(data, w); total += w.length; }
  if (hasCooldown(d)) { done += countDone(data, COOLDOWN_ITEMS); total += COOLDOWN_ITEMS.length; }
  return { done: done, total: total };
}
function getDayPct(d) {
  var s = getDaySlots(d);
  return s.total ? Math.round(s.done / s.total * 100) : 0;
}
function hasActivity(d) {
  var data = store.dates[dateKey(d)] || {};
  if (getDaySlots(d).done > 0) return true;
  for (var i = 0; i < ADDON_KEYS.length; i++) if (data[ADDON_KEYS[i]]) return true;
  return false;
}
// 이번 주(월요일 시작) 본 세션(A·B·R) 완료 수 — 절반 이상 체크하면 1회로 인정
function coreSessionsThisWeek() {
  var t = todayDate();
  var dow = t.getDay();
  var offset = (dow === 0) ? -6 : (1 - dow);
  var monday = new Date(t.getFullYear(), t.getMonth(), t.getDate() + offset);
  var n = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    if (d > t) break;
    var r = getRoutineForDate(d);
    if (CORE_TYPES.indexOf(r.type) < 0) continue;
    var s = getDaySlots(d);
    if (s.total > 0 && s.done / s.total >= 0.5) n++;
  }
  return n;
}

// ═══════════════════════════════════════════
// 하루 달성률을 저장소에 함께 기록 — index.html이 이 값을 읽기만 하도록
function syncPct(d) {
  var day = d || currentDate;
  var k = dateKey(day);
  if (!store.dates[k]) return;
  store.dates[k].pct = getDayPct(day);
  saveStore(store);
}

function toggleItem(k) {

function pickRoutine(type) {

  if (rec.type === type) delete data.routineType;
  else data.routineType = type;
  saveStore(store);
  syncPct();
  render();

function toggleEasy() { var data = getDayData(); data.easy = !data.easy; saveStore(store); syncPct(); render(); }
function pickPhase(key) { setManualPhase(key || null); render(); }
function clearManualPhase() { setManualPhase(null); render(); }

function saveMemo() {
  var data = getDayData();
  data.memo = document.getElementById('memo-input').value;

  showSavedIndicator('memo-saved', false);

var saveTimers = {};
function showSavedIndicator(elId, immediate) {
  var ind = document.getElementById(elId);
  if (!ind) return;
  if (saveTimers[elId]) { clearTimeout(saveTimers[elId].t1); clearTimeout(saveTimers[elId].t2); }
  saveTimers[elId] = {};
  if (immediate) {
    ind.textContent = '✓ 저장됨';
    ind.className = 'save-indicator saved show';
    saveTimers[elId].t2 = setTimeout(function() { ind.classList.remove('show'); }, 2000);
  } else {
    ind.textContent = '💾 저장 중...';
    ind.className = 'save-indicator saving show';
    saveTimers[elId].t1 = setTimeout(function() {
      ind.textContent = '✓ 저장됨';
      ind.className = 'save-indicator saved show';
      saveTimers[elId].t2 = setTimeout(function() { ind.classList.remove('show'); }, 2000);
    }, 400);
  }
}

function resetToday() {
  if (!window.confirm(dateKey(currentDate) + ' 의 운동 기록을 모두 초기화할까요?')) return;
  delete store.dates[dateKey(currentDate)];
  saveStore(store);
  render();

var WEEK_DAYS = ['일','월','화','수','목','금','토'];

function render() {
  var t = todayDate();
  var dayText;
  if (dateKey(currentDate) === dateKey(t)) dayText = '오늘';
  else if (dateKey(currentDate) === dateKey(new Date(t.getFullYear(), t.getMonth(), t.getDate()-1))) dayText = '어제';
  else dayText = (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일';
  document.getElementById('date-text').firstChild.nodeValue = dayText;
  document.getElementById('date-sub').textContent =
    (currentDate.getMonth()+1) + '월 ' + currentDate.getDate() + '일 (' + WEEK_DAYS[currentDate.getDay()] + ')';

  renderInfo();

  var data = store.dates[dateKey(currentDate)] || {};
  for (var i = 0; i < ADDON_KEYS.length; i++) {
    var btn = document.getElementById('opt-' + ADDON_KEYS[i]);
    if (btn) { if (data[ADDON_KEYS[i]]) btn.classList.add('on'); else btn.classList.remove('on'); }
  }
  document.getElementById('memo-input').value = data.memo || '';

  renderRehab();
  renderWarmup();
  renderRoutine();
  renderCooldown();
  updateProgress();
  updateSummary();
  renderPhaseControls();
}

function renderInfo() {
  var phase = getEffectivePhase(currentDate);
  var data = store.dates[dateKey(currentDate)] || {};
  var autoPhase = getPhaseForDate(currentDate);
  var dday = Math.round((COMP_START - new Date(currentDate.getFullYear(),currentDate.getMonth(),currentDate.getDate()))/86400000);

  var manualNote = '';
  if (data.dayPhase) manualNote = ' · <span style="color:#B8412A">이 날만 ' + phaseByKey(data.dayPhase).name + '</span>';
  else if (getManualPhase() && getManualPhase() !== autoPhase.key) manualNote = ' · <span style="color:#B8412A">수동 ' + phase.name + ' 유지 중</span>';
  var easyNote = data.easy ? ' · <span style="color:#C77F2E">😌 오늘은 가볍게</span>' : '';

  var html = '<div style="display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;-webkit-flex-wrap:wrap;flex-wrap:wrap">'
    + '<span style="font-weight:800;color:' + phase.color + '">' + phase.id + ' ' + phase.name + '</span>'
    + '<span style="font-size:11px;color:#8B7355">' + (dday > 0 ? 'D-' + dday : (dday === 0 ? 'D-DAY' : '대회 중')) + '</span>'
    + manualNote + easyNote + '</div>'
    + '<div style="font-size:12px;color:#8B7355;margin-top:4px">' + phase.focus + '</div>';

  // 주간 구조 미니맵
  var t = todayDate();
  var dow = t.getDay();
  var offset = (dow === 0) ? -6 : (1 - dow);
  var monday = new Date(t.getFullYear(), t.getMonth(), t.getDate() + offset);
  html += '<div class="weekmap">';
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    var ty = DAY_TYPE[d.getDay()];
    var isToday = dateKey(d) === dateKey(currentDate);
    html += '<div class="wm-day' + (isToday ? ' today' : '') + '">';
    html += '<div class="wm-dow">' + WEEK_DAYS[d.getDay()] + '</div>';
    html += '<div class="wm-type ' + ty + '">' + ty + '</div>';
    html += '<div class="wm-min">' + TYPE_MIN[ty] + '</div>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('today-info').innerHTML = html;
}

function renderRehab() {
  var card = document.getElementById('rehab-card');
  var phase = getEffectivePhase(currentDate);
  var allClear = rehabAllClear();

  if (phase.key === 'recovery') {
    card.style.display = '';
    card.style.borderColor = 'var(--c-coral)';
    document.getElementById('rehab-card-inner').innerHTML =
        '<div class="rehab-warn-head">⚠️ 엄지 주의사항</div>'
      + '<ul class="rehab-warn-list">'
      + '<li>오른손 <strong>엄지로 쥐거나 바닥을 짚는 동작 금지</strong> — 지지는 왼손·전완·주먹으로</li>'
      + '<li>통증·부기·저림이 <strong>악화되면 즉시 중단</strong></li>'
      + '<li>하체·유산소·코어는 정상 진행 · <strong>그립/당기기 운동은 회복 후에</strong></li>'
      + '<li>복귀 시점과 재활 강도는 <strong>반드시 의료진과 확인</strong></li>'
      + '</ul>';
    return;
  }

  if (phase.key === 'rebuild' && !allClear) {
    card.style.display = '';
    card.style.borderColor = 'var(--c-coral)';
    var r = loadRehab();
    var collapsed = getRehabCollapsed();
    var doneCount = 0;
    for (var j = 0; j < REHAB_CHECKS.length; j++) if (r[REHAB_CHECKS[j].k]) doneCount++;

    var html = '<div class="rehab-head" onclick="toggleRehabCollapse()">';
    html += '<div><span class="rehab-title">🩹 엄지 재활 체크포인트</span>';
    html += '<span class="rehab-badge-inline">' + doneCount + '/' + REHAB_CHECKS.length + '</span></div>';
    html += '<span class="rehab-caret">' + (collapsed ? '▾' : '▴') + '</span>';
    html += '</div>';
    html += '<div style="display:' + (collapsed ? 'none' : 'block') + '">';
    html += '<div class="card-sub" style="margin:8px 0 4px">그립 운동을 열기 전 아래 4가지를 확인하세요.</div>';
    for (var i = 0; i < REHAB_CHECKS.length; i++) {
      var c = REHAB_CHECKS[i];
      var done = !!r[c.k];
      html += '<div class="workout-row' + (done ? ' done' : '') + '" onclick="toggleRehab(\'' + c.k + '\')">';
      html += '<div class="checkbox' + (done ? ' done' : '') + '"></div>';
      html += '<div class="workout-content"><div><span class="workout-name">' + c.label + '</span></div>';
      html += '<div class="workout-detail">' + c.detail + '</div></div></div>';
    }
    html += '<div class="tip-coral" style="margin-top:10px">⚠️ 그립·당기기 운동은 <strong>통증 없이 쥘 수 있을 때까지</strong> 미루세요. 복귀 시점은 의료진과 확인하세요.</div>';
    html += '</div>';
    document.getElementById('rehab-card-inner').innerHTML = html;
    return;
  }
  card.style.display = 'none';
}

function itemRow(item, idx, typeCls, gripGate) {
  var data = store.dates[dateKey(currentDate)] || {};
  var done = !!data[item.k];
  var warn = (gripGate && item.grip);
  var h = '<div class="workout-row' + (done ? ' done' : '') + (warn ? ' grip-warn' : '') + '" onclick="toggleItem(\'' + item.k + '\')">';
  h += '<div class="checkbox' + (done ? ' done' : '') + '"></div>';
  h += '<div class="workout-content"><div>';
  if (item.ss) h += '<span class="ss-label">' + item.ss + '</span>';
  else h += '<span class="workout-num">' + idx + '</span>';
  h += '<span class="workout-name">' + item.name + '</span>';
  h += '<span class="workout-target ' + typeCls + '">' + item.target + '</span>';
  if (warn) h += '<span class="grip-badge">✋ 그립 주의</span>';
  h += '</div>';
  h += '<div class="workout-detail">' + item.detail + (warn ? ' <strong style="color:var(--c-coral)">— 재활 체크포인트 통과 전까지 무리한 그립 금지</strong>' : '') + '</div>';
  h += '</div></div>';
  return h;
}

function renderRoutine() {
  var routine = getRoutineForDate(currentDate);
  var phase = getEffectivePhase(currentDate);
  var data = store.dates[dateKey(currentDate)] || {};

  document.getElementById('routine-title').textContent = '🏋️ ' + routine.name;
  document.getElementById('routine-sub').textContent = routine.sub;
  var badge = document.getElementById('routine-badge');
  badge.textContent = TYPE_MIN[routine.type];
  badge.className = 'routine-badge ' + routine.type;

  var rec = getRecommendedRoutine(currentDate);
  var labelEl = document.getElementById('routine-picker-label');
  if (data.routineType && data.routineType !== rec.type) {
    labelEl.innerHTML = '오늘 추천: <strong>' + TYPE_SHORT[rec.type] + '</strong> · 직접 <strong>' + TYPE_SHORT[routine.type] + '</strong> 선택함';
  } else {
    labelEl.innerHTML = phase.name + ' · ' + WEEK_DAYS[currentDate.getDay()] + '요일 기본 <strong>' + TYPE_SHORT[rec.type] + '</strong> (바꿀 수 있어요)';
  }
  var types = ['A','B','R','K','S'];
  for (var ti = 0; ti < types.length; ti++) {
    var rb = document.getElementById('rp-' + types[ti]);
    if (rb) { if (routine.type === types[ti]) rb.classList.add('on'); else rb.classList.remove('on'); }
  }

  var gripGate = (phase.key === 'rebuild' && !rehabAllClear());
  var html = '';
  for (var i = 0; i < routine.items.length; i++) {
    html += itemRow(routine.items[i], i + 1, routine.type, gripGate);
  }
  document.getElementById('routine-items').innerHTML = html;
}

function renderWarmup() {
  var card = document.getElementById('warmup-card');
  if (!hasWarmup(currentDate)) { card.style.display = 'none'; return; }
  card.style.display = '';
  var items = getWarmupItems(currentDate);
  var html = '';
  for (var i = 0; i < items.length; i++) html += itemRow(items[i], i + 1, 'W', false);
  document.getElementById('warmup-items').innerHTML = html;
}

function renderCooldown() {
  var card = document.getElementById('cooldown-card');
  if (!hasCooldown(currentDate)) { card.style.display = 'none'; return; }
  card.style.display = '';
  var html = '';
  for (var i = 0; i < COOLDOWN_ITEMS.length; i++) html += itemRow(COOLDOWN_ITEMS[i], i + 1, 'C', false);
  document.getElementById('cooldown-items').innerHTML = html;
}

function updateProgress() {
  var s = getDaySlots(currentDate);
  var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-text').textContent = s.done + '/' + s.total + ' 항목 완료';
}

function renderPhaseControls() {
  var wrap = document.getElementById('phase-controls');
  var data = store.dates[dateKey(currentDate)] || {};
  var autoPhase = getPhaseForDate(currentDate);
  var manual = getManualPhase();
  var isEasy = !!data.easy;

  var html = '';
  html += '<button class="phase-ctrl-btn' + (isEasy ? ' on' : '') + '" onclick="toggleEasy()">'
       + (isEasy ? '😌 오늘은 가볍게 (해제)' : '😌 오늘은 가볍게') + '</button>';
  html += '<div class="phase-select-row">';
  html += '<span class="phase-select-lbl">국면 수동 지정:</span>';
  html += '<select class="phase-select" onchange="pickPhase(this.value)">';
  html += '<option value="">자동 (' + autoPhase.name + ')</option>';
  for (var i = 0; i < PHASES.length; i++) {
    var sel = (manual === PHASES[i].key) ? ' selected' : '';
    html += '<option value="' + PHASES[i].key + '"' + sel + '>' + PHASES[i].id + ' ' + PHASES[i].name + '</option>';
  }
  html += '</select></div>';
  if (manual) html += '<div class="phase-manual-note">수동 국면 유지 중 · <a href="#" onclick="clearManualPhase();return false;">자동으로 복귀</a></div>';
  wrap.innerHTML = html;
}

function updateSummary() {
  document.getElementById('sum-today').textContent = getDayPct(currentDate) + '%';

  var t = todayDate();
  var weekCount = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    if (hasActivity(d)) weekCount++;
  }
  document.getElementById('sum-week').textContent = weekCount;
  document.getElementById('sum-week-goal').textContent = coreSessionsThisWeek() + '/3';
}

// ═══════════════════════════════════════════
// 날짜 이동 / 뷰 전환
// ═══════════════════════════════════════════
function changeDate(delta) {
  var d = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + delta);
  var t = todayDate();
  if (d < PLAN_START) return;
  if (d > t) return;
  currentDate = d;
  render();
}

function switchView(v) {
  if (v === 'day') {
    document.getElementById('view-day').style.display = '';
    document.getElementById('view-week').style.display = 'none';
    document.getElementById('view-day-btn').classList.add('on');
    document.getElementById('view-week-btn').classList.remove('on');
  } else {
    document.getElementById('view-day').style.display = 'none';
    document.getElementById('view-week').style.display = '';
    document.getElementById('view-day-btn').classList.remove('on');
    document.getElementById('view-week-btn').classList.add('on');
    renderWeekly();
  }
  window.scrollTo(0, 0);
}

function renderWeekly() {
  var t = todayDate();
  var html = '';
  for (var i = 0; i < 7; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var pct = getDayPct(d);
    var routine = getRoutineForDate(d);
    var label = (i === 0) ? '오늘' : (i === 1 ? '어제' : (d.getMonth()+1) + '/' + d.getDate() + ' ' + WEEK_DAYS[d.getDay()]);
    html += '<div class="weekly-row">';
    html += '<div class="weekly-day">' + label + '</div>';
    html += '<div class="weekly-bar-track">';
    if (pct > 0) html += '<div class="weekly-bar-fill" style="width:' + pct + '%"></div>';
    html += '</div>';
    html += '<div class="weekly-label">' + routine.type + '</div>';
    html += '<div class="weekly-pct">' + pct + '%</div>';
    html += '</div>';
  }
  document.getElementById('weekly-list').innerHTML = html;

  var trackedDays = 0, activeDays = 0, totalPct = 0;
  var typeCounts = { A:0, B:0, R:0, K:0, S:0 };
  var addonCounts = { cardio:0, stretch:0, korfball:0, rest:0, recovery:0 };

  for (var i = 0; i < 30; i++) {
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    if (d < PLAN_START) break;
    var data = store.dates[dateKey(d)];
    if (!data) continue;
    trackedDays++;
    if (hasActivity(d)) {
      activeDays++;
      var routine = getRoutineForDate(d);
      if (countDone(data, routine.items) > 0) typeCounts[routine.type]++;
    }
    for (var j = 0; j < ADDON_KEYS.length; j++) if (data[ADDON_KEYS[j]]) addonCounts[ADDON_KEYS[j]]++;
    totalPct += getDayPct(d);
  }
  var avgPct = trackedDays ? Math.round(totalPct / trackedDays) : 0;

  function statRow(label, val) {
    return '<div class="weekly-row"><div class="weekly-day" style="width:auto;-webkit-flex:1;flex:1">' + label +
           '</div><div class="weekly-pct" style="width:auto;font-size:14px">' + val + '</div></div>';
  }
  var s = '';
  if (trackedDays === 0) {
    s = '<div class="empty-state">아직 기록이 없어요</div>';
  } else {
    s += statRow('운동한 날', activeDays + '/' + trackedDays + '일');
    s += statRow('평균 달성률', avgPct + '%');
    if (typeCounts.A) s += statRow('A · 파워', typeCounts.A + '회');
    if (typeCounts.B) s += statRow('B · 근력', typeCounts.B + '회');
    if (typeCounts.R) s += statRow('R · 회복근력', typeCounts.R + '회');
    if (typeCounts.K) s += statRow('🏆 코프볼 훈련일', typeCounts.K + '회');
    if (typeCounts.S) s += statRow('S · 회복', typeCounts.S + '회');
    if (addonCounts.cardio) s += statRow('🏃‍♂️ 추가 유산소', addonCounts.cardio + '회');
    if (addonCounts.rest) s += statRow('🛌 완전 휴식', addonCounts.rest + '회');
  }
  document.getElementById('month-stats').innerHTML = s;
}

function goHome() { window.location.href = 'index.html'; }

render();
</script>
</body>
</html>
