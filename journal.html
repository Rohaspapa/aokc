<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="기록 일기">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon" sizes="360x360" href="icon-360.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#1A5CA0">
<title>기록 일기 — AOKC 2026</title>
<style>
:root {
  --c-bg: #F5F2EA;
  --c-surface: #FFFFFF;
  --c-surface-2: #FAF8F2;
  --c-border: #E0DCCF;
  --c-text: #1A1916;
  --c-muted: #7A7468;
  --c-accent: #0F4C36;
  --c-accent-light: #DCE9E1;
  --c-amber-light: #F8EBCF;
  --c-coral: #B8412A;
  --c-coral-light: #F8E2DA;
  --c-blue: #1A5CA0;
  --c-blue-light: #DEEAF7;
  --c-purple: #5C3DAF;
  --c-purple-light: #E8E2F5;
  --c-gold: #B8923A;
  --c-line: #E0DCCF;
  --c-ink: #1A1916;
  --c-ink-soft: #7A7468;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  background: var(--c-bg); color: var(--c-text); min-height: 100vh;
  font-size: 14px; line-height: 1.5; padding-bottom: calc(20px + var(--safe-bottom));
}
.header {
  background: -webkit-linear-gradient(180deg, #1A5CA0 0%, #2E76C0 100%);
  background: linear-gradient(180deg, #1A5CA0 0%, #2E76C0 100%);
  color: #fff; padding: 16px 18px 14px; position: sticky; top: 0; z-index: 100;
}
.header-row {
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center;
}
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.back-btn {
  background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 10px;
  border-radius: 6px; font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.content { padding: 14px; }

.search-box {
  background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 12px;
  padding: 10px; margin-bottom: 12px;
  display: -webkit-flex; display: flex; gap: 8px;
  -webkit-align-items: center; align-items: center;
}
.search-icon { font-size: 16px; color: var(--c-muted); -webkit-flex-shrink: 0; flex-shrink: 0; padding-left: 6px; }
.search-input {
  -webkit-flex: 1; flex: 1; border: none; font-size: 14px; font-family: inherit;
  background: transparent; -webkit-appearance: none; appearance: none; outline: none; padding: 4px 0;
}
.clear-btn {
  background: var(--c-border); color: var(--c-muted); border: none;
  width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit; -webkit-flex-shrink: 0; flex-shrink: 0;
}
.filter-tabs {
  display: -webkit-flex; display: flex; background: var(--c-surface-2);
  border: 1px solid var(--c-border); border-radius: 10px; padding: 3px; margin-bottom: 14px;
}
.filter-btn {
  -webkit-flex: 1; flex: 1; padding: 8px; font-size: 12px; font-weight: 600;
  background: transparent; border: none; border-radius: 8px; color: var(--c-muted);
  cursor: pointer; font-family: inherit;
}
.filter-btn.on {
  background: var(--c-surface); color: var(--c-text);
  -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
.stats-row { display: -webkit-flex; display: flex; gap: 8px; margin-bottom: 12px; }
.stat-box {
  -webkit-flex: 1; flex: 1; background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 12px; padding: 10px 8px; text-align: center;
}
.stat-num { font-size: 20px; font-weight: 800; line-height: 1.1; color: var(--c-blue); }
.stat-num.purple { color: var(--c-purple); }
.stat-num.gold { color: var(--c-gold); }
.stat-lbl { font-size: 10px; color: var(--c-muted); margin-top: 3px; font-weight: 600; }

.card {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.month-nav {
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between; margin-bottom: 12px;
}
.month-nav h3 { font-size: 16px; font-weight: 700; }
.nav-btn {
  background: var(--c-blue-light); color: var(--c-blue); border: none;
  padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-head { text-align: center; font-size: 10px; font-weight: 700; color: var(--c-muted); padding: 4px 0; }
.cal-head.sun { color: var(--c-coral); }
.cal-head.sat { color: var(--c-blue); }
.cal-cell {
  background: var(--c-surface-2); border: 1px solid var(--c-border); border-radius: 6px;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  font-size: 12px; height: 50px; cursor: pointer;
  -webkit-user-select: none; user-select: none; padding: 4px 0;
}
@supports (aspect-ratio: 1) { .cal-cell { aspect-ratio: 1; height: auto; min-height: 46px; } }
.cal-cell.empty { background: transparent; border: none; cursor: default; }
.cal-cell.today { border-color: var(--c-blue); border-width: 2px; }
.cal-cell.dday { background: var(--c-gold); color: #fff; font-weight: 700; border-color: var(--c-gold); }
.cal-cell.future { opacity: 0.4; cursor: default; }
.cal-cell.has-memo { background: var(--c-surface); }
.cal-cell.selected { background: var(--c-blue); color: #fff; border-color: var(--c-blue); }
.cal-day { font-weight: 600; }
.memo-dots {
  display: -webkit-flex; display: flex; gap: 3px; margin-top: 3px;
  -webkit-align-items: center; align-items: center;
}
.memo-dot { width: 5px; height: 5px; border-radius: 50%; }
.memo-dot.workout { background: var(--c-blue); }
.memo-dot.mental { background: var(--c-purple); }
.cal-cell.selected .memo-dot, .cal-cell.dday .memo-dot { background: #fff; }
.legend {
  display: -webkit-flex; display: flex;
  -webkit-justify-content: center; justify-content: center;
  -webkit-align-items: center; align-items: center;
  gap: 14px; font-size: 11px; color: var(--c-muted); margin-top: 10px;
}
.legend-item { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 4px; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }

.selected-section { margin-top: 14px; }
.selected-date {
  font-size: 14px; font-weight: 700; margin-bottom: 10px;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
}
.selected-date .day-num { font-size: 16px; color: var(--c-blue); }
.memo-card {
  background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 12px;
  padding: 13px; margin-bottom: 10px; border-left: 4px solid var(--c-blue);
}
.memo-card.mental { border-left-color: var(--c-purple); }
.memo-card-head {
  display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-align-items: center; align-items: center; margin-bottom: 8px;
}
.memo-type {
  display: -webkit-inline-flex; display: inline-flex;
  -webkit-align-items: center; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px;
}
.memo-type.workout { background: var(--c-blue-light); color: var(--c-blue); }
.memo-type.mental { background: var(--c-purple-light); color: var(--c-purple); }
.memo-meta { font-size: 11px; color: var(--c-muted); }
.memo-icons { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.memo-icon-tag {
  font-size: 11px; padding: 2px 7px; background: var(--c-surface-2);
  border: 1px solid var(--c-border); border-radius: 8px; color: var(--c-muted);
}
.memo-word {
  display: inline-block; font-size: 13px; font-weight: 800; color: var(--c-purple);
  background: var(--c-purple-light); padding: 4px 12px; border-radius: 12px; margin-bottom: 8px;
}
.memo-text { font-size: 13px; line-height: 1.6; color: var(--c-text); white-space: pre-wrap; word-break: break-word; }
.memo-rating { margin-top: 8px; font-size: 16px; }
.memo-rating .label { font-size: 11px; color: var(--c-muted); font-weight: 600; margin-right: 4px; }
.search-result { cursor: pointer; }
.search-result:active { background: var(--c-surface-2); }
.highlight { background: #FFE6A0; color: var(--c-text); padding: 0 2px; border-radius: 2px; font-weight: 600; }
.empty-state { text-align: center; padding: 28px 20px; color: var(--c-muted); font-size: 13px; line-height: 1.6; }
.empty-state .big { font-size: 36px; margin-bottom: 8px; opacity: 0.5; }
.result-header { font-size: 12px; color: var(--c-muted); margin-bottom: 10px; padding: 0 4px; }
.result-header strong { color: var(--c-text); font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>📔 기록 일기</h1>
      <p>운동·멘탈 메모를 돌아보기</p>
    </div>
    <button class="back-btn" onclick="goHome()">← 메인</button>
  </div>
</div>

<div class="content">

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="search-input" placeholder="키워드 검색 (예: 무릎, 착지, 자신감)" oninput="onSearchInput()">
    <button class="clear-btn" id="clear-btn" onclick="clearSearch()" style="display:none">✕</button>
  </div>

  <div class="filter-tabs">
    <button class="filter-btn on" id="ft-all" onclick="setFilter('all')">전체</button>
    <button class="filter-btn" id="ft-workout" onclick="setFilter('workout')">🏋️ 운동만</button>
    <button class="filter-btn" id="ft-mental" onclick="setFilter('mental')">🧠 멘탈만</button>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="stat-workout">0</div><div class="stat-lbl">🏋️ 운동 메모</div></div>
    <div class="stat-box"><div class="stat-num purple" id="stat-mental">0</div><div class="stat-lbl">🧠 멘탈 메모</div></div>
    <div class="stat-box"><div class="stat-num gold" id="stat-days">0</div><div class="stat-lbl">기록한 날</div></div>
  </div>

  <div id="calendar-mode">
    <div class="card">
      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <h3 id="cal-title">—</h3>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="cal-grid">
        <div class="cal-head sun">일</div><div class="cal-head">월</div><div class="cal-head">화</div>
        <div class="cal-head">수</div><div class="cal-head">목</div><div class="cal-head">금</div>
        <div class="cal-head sat">토</div>
      </div>
      <div class="cal-grid" id="cal-body" style="margin-top:4px"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--c-blue)"></div>운동 메모</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--c-purple)"></div>멘탈 메모</div>
      </div>
    </div>
    <div class="selected-section" id="selected-section"></div>
  </div>

  <div id="search-mode" style="display:none">
    <div class="result-header" id="result-header"></div>
    <div id="search-results"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
// 기록 일기 — 읽기 전용. 저장소를 절대 수정하지 않는다.
// 대회 2026-12-06 ~ 12-12
// ═══════════════════════════════════════════
var COMP_START = new Date(2026, 11, 6);
var COMP_END   = new Date(2026, 11, 12);
var CAL_MIN = new Date(2026, 5, 1);   // 6월 (프로그램 시작 6/29)
var CAL_MAX = new Date(2026, 11, 1);

var KEYS = { workout: 'aokc2026_workout', mental: 'aokc2026_mental' };
var WEEK_DAYS = ['일','월','화','수','목','금','토'];

// 현행 운동 추가활동 키 (workout.html 과 일치)
var WORKOUT_OPTS = {
  cardio:   '🏃‍♂️ 유산소',
  stretch:  '🧘 스트레칭',
  korfball: '🏆 코프볼 훈련',
  rest:     '🛌 완전 휴식',
  recovery: '🩹 회복 루틴'
};
var ROUTINE_TYPE = { A:'A · 파워', B:'B · 근력', R:'R · 회복근력', K:'코프볼 훈련', S:'회복' };
var DAY_TYPE = { 0:'K', 1:'R', 2:'S', 3:'A', 4:'B', 5:'K', 6:'S' };

var MENTAL_CORE = { r1:'기상 의도', r3:'훈련 키워드', r6:'취침 이미지' };
var RATING_EMOJI = ['', '😣', '😕', '😐', '🙂', '😄'];
var RATING_LABEL = ['', '매우 흐림', '흐림', '평이', '맑음', '매우 맑음'];

function loadS(key) {
  try { var raw = window.localStorage.getItem(key); if (raw) { var o = JSON.parse(raw); if (!o.dates) o.dates = {}; return o; } } catch (e) {}
  return { dates: {} };
}
function getStores() { return { workout: loadS(KEYS.workout), mental: loadS(KEYS.mental) }; }

function dateKey(d) {
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}
function todayDate() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function isCompDay(d) { return d >= COMP_START && d <= COMP_END; }
function formatDate(d) {
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEK_DAYS[d.getDay()] + ')';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlight(s, q) {
  var safe = esc(s);
  if (!q) return safe;
  var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<span class="highlight">$1</span>');
}

// ── 메모 추출 ──
function workoutMemo(st, k) {
  var d = st.workout.dates[k];
  if (!d || !d.memo || !d.memo.trim()) return null;
  var icons = [];
  var ty = d.routineType || DAY_TYPE[parseKey(k).getDay()];
  if (ROUTINE_TYPE[ty]) icons.push('🏋️ ' + ROUTINE_TYPE[ty]);
  for (var key in WORKOUT_OPTS) if (d[key]) icons.push(WORKOUT_OPTS[key]);
  if (d.easy) icons.push('😌 가볍게');
  return { type:'workout', text:d.memo.trim(), icons:icons, pct:(typeof d.pct === 'number' ? d.pct : null) };
}
function mentalMemo(st, k) {
  var d = st.mental.dates[k];
  if (!d) return null;
  var hasMemo = d.memo && d.memo.trim();
  var hasWord = d.word && d.word.trim();
  if (!hasMemo && !hasWord) return null;
  var n = 0;
  for (var key in MENTAL_CORE) if (d[key]) n++;
  return { type:'mental', text:(d.memo || '').trim(), word:(d.word || '').trim(), core:n, rating:d.rating || null };
}

// ── 상태 ──
var calMonth = new Date(todayDate().getFullYear(), todayDate().getMonth(), 1);
var selectedDate = null;
var currentFilter = 'all';
var searchQuery = '';

function renderCalendar() {
  var st = getStores();
  var y = calMonth.getFullYear(), mo = calMonth.getMonth();
  document.getElementById('cal-title').textContent = y + '년 ' + (mo + 1) + '월';
  var first = new Date(y, mo, 1).getDay();
  var last = new Date(y, mo + 1, 0).getDate();
  var tk = dateKey(todayDate());
  var sk = selectedDate ? dateKey(selectedDate) : null;
  var html = '';
  for (var i = 0; i < first; i++) html += '<div class="cal-cell empty"></div>';
  for (var dd = 1; dd <= last; dd++) {
    var d = new Date(y, mo, dd), k = dateKey(d);
    var w = workoutMemo(st, k), m = mentalMemo(st, k);
    var showW = w && (currentFilter === 'all' || currentFilter === 'workout');
    var showM = m && (currentFilter === 'all' || currentFilter === 'mental');
    var future = d > todayDate();
    var cls = ['cal-cell'];
    if (isCompDay(d)) cls.push('dday');
    else if (showW || showM) cls.push('has-memo');
    else if (future) cls.push('future');
    if (k === tk) cls.push('today');
    if (k === sk) cls.push('selected');
    var click = future ? '' : ' onclick="selectDate(\'' + k + '\')"';
    html += '<div class="' + cls.join(' ') + '"' + click + '><div class="cal-day">' + dd + '</div>';
    var dots = '';
    if (showW) dots += '<div class="memo-dot workout"></div>';
    if (showM) dots += '<div class="memo-dot mental"></div>';
    if (dots) html += '<div class="memo-dots">' + dots + '</div>';
    html += '</div>';
  }
  document.getElementById('cal-body').innerHTML = html;
}

function selectDate(k) {
  selectedDate = parseKey(k);
  renderCalendar();
  renderSelected();
  setTimeout(function() {
    var el = document.getElementById('selected-section');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 50);
}

function workoutCard(m, q) {
  var h = '<div class="memo-card workout"><div class="memo-card-head">';
  h += '<span class="memo-type workout">🏋️ 운동</span>';
  h += '<span class="memo-meta">' + (m.pct !== null ? m.pct + '% 완료' : m.icons.length + '개 활동') + '</span></div>';
  if (m.icons.length) {
    h += '<div class="memo-icons">';
    for (var i = 0; i < m.icons.length; i++) h += '<span class="memo-icon-tag">' + m.icons[i] + '</span>';
    h += '</div>';
  }
  h += '<div class="memo-text">' + highlight(m.text, q) + '</div></div>';
  return h;
}
function mentalCard(m, q) {
  var h = '<div class="memo-card mental"><div class="memo-card-head">';
  h += '<span class="memo-type mental">🧠 멘탈</span>';
  h += '<span class="memo-meta">필수 ' + m.core + '/3</span></div>';
  if (m.word) h += '<div class="memo-word">💭 ' + esc(m.word) + '</div>';
  if (m.text) h += '<div class="memo-text">' + highlight(m.text, q) + '</div>';
  if (m.rating) h += '<div class="memo-rating"><span class="label">자기평가:</span>' + RATING_EMOJI[m.rating] +
                     ' <span style="font-size:11px;color:var(--c-muted)">' + RATING_LABEL[m.rating] + '</span></div>';
  h += '</div>';
  return h;
}

function renderSelected() {
  var sec = document.getElementById('selected-section');
  if (!selectedDate) {
    sec.innerHTML = '<div class="empty-state"><div class="big">📅</div>달력에서 날짜를 탭해서<br>그날의 기록을 확인하세요</div>';
    return;
  }
  var st = getStores(), k = dateKey(selectedDate);
  var w = workoutMemo(st, k), m = mentalMemo(st, k);
  var showW = w && (currentFilter === 'all' || currentFilter === 'workout');
  var showM = m && (currentFilter === 'all' || currentFilter === 'mental');
  var h = '<div class="selected-date"><div>' + formatDate(selectedDate) + '</div>' +
          '<div class="day-num">' + selectedDate.getDate() + '</div></div>';
  if (!showW && !showM) {
    h += '<div class="empty-state"><div class="big">📭</div>이 날엔 ' +
         (currentFilter === 'all' ? '메모가' : (currentFilter === 'workout' ? '운동 메모가' : '멘탈 메모가')) +
         ' 없어요<br><span style="font-size:11px;opacity:0.7">' +
         (currentFilter === 'all' ? '운동·멘탈 페이지에서 기록할 수 있어요' : '필터를 "전체"로 바꿔보세요') + '</span></div>';
  } else {
    if (showW) h += workoutCard(w, '');
    if (showM) h += mentalCard(m, '');
  }
  sec.innerHTML = h;
}

function changeMonth(delta) {
  var m = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  if (m < CAL_MIN || m > CAL_MAX) return;
  calMonth = m;
  renderCalendar();
}

function setFilter(f) {
  currentFilter = f;
  var ids = ['all','workout','mental'];
  for (var i = 0; i < ids.length; i++) {
    var b = document.getElementById('ft-' + ids[i]);
    if (ids[i] === f) b.classList.add('on'); else b.classList.remove('on');
  }
  if (searchQuery) renderSearch();
  else { renderCalendar(); renderSelected(); }
  renderStats();
}

function onSearchInput() {
  searchQuery = document.getElementById('search-input').value.trim();
  document.getElementById('clear-btn').style.display = searchQuery ? '' : 'none';
  if (searchQuery) {
    document.getElementById('calendar-mode').style.display = 'none';
    document.getElementById('search-mode').style.display = '';
    renderSearch();
  } else {
    document.getElementById('calendar-mode').style.display = '';
    document.getElementById('search-mode').style.display = 'none';
  }
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('clear-btn').style.display = 'none';
  document.getElementById('calendar-mode').style.display = '';
  document.getElementById('search-mode').style.display = 'none';
  document.getElementById('search-input').blur();
}

function renderSearch() {
  var st = getStores(), q = searchQuery.toLowerCase(), results = [];
  var all = {};
  for (var k in st.workout.dates) all[k] = 1;
  for (var k in st.mental.dates) all[k] = 1;
  for (var k in all) {
    var w = workoutMemo(st, k), m = mentalMemo(st, k);
    if (w && (currentFilter === 'all' || currentFilter === 'workout') && w.text.toLowerCase().indexOf(q) >= 0)
      results.push({ key:k, memo:w });
    if (m && (currentFilter === 'all' || currentFilter === 'mental') &&
        ((m.text && m.text.toLowerCase().indexOf(q) >= 0) || (m.word && m.word.toLowerCase().indexOf(q) >= 0)))
      results.push({ key:k, memo:m });
  }
  results.sort(function(a, b) { return a.key < b.key ? 1 : -1; });

  var hdr = document.getElementById('result-header');
  if (!results.length) {
    hdr.innerHTML = '<strong>"' + esc(searchQuery) + '"</strong> 검색 결과 없음';
    document.getElementById('search-results').innerHTML =
      '<div class="empty-state"><div class="big">🔍</div>검색 결과가 없어요<br><span style="font-size:11px;opacity:0.7">다른 키워드를 시도하거나 필터를 바꿔보세요</span></div>';
    return;
  }
  hdr.innerHTML = '<strong>"' + esc(searchQuery) + '"</strong> 검색 결과 — ' + results.length + '건';
  var h = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i], d = parseKey(r.key);
    h += '<div class="search-result" onclick="goToDate(\'' + r.key + '\')">';
    h += '<div style="font-size:11px;color:var(--c-muted);margin:0 0 4px 4px">' + formatDate(d) + '</div>';
    h += (r.memo.type === 'workout') ? workoutCard(r.memo, searchQuery) : mentalCard(r.memo, searchQuery);
    h += '</div>';
  }
  document.getElementById('search-results').innerHTML = h;
}

function goToDate(k) {
  clearSearch();
  var d = parseKey(k);
  calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  selectedDate = d;
  renderCalendar();
  renderSelected();
  setTimeout(function() {
    var el = document.getElementById('selected-section');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 100);
}

function renderStats() {
  var st = getStores(), wc = 0, mc = 0, days = {};
  for (var k in st.workout.dates) if (workoutMemo(st, k)) { wc++; days[k] = 1; }
  for (var k in st.mental.dates) if (mentalMemo(st, k)) { mc++; days[k] = 1; }
  var n = 0;
  for (var k in days) n++;
  document.getElementById('stat-workout').textContent = wc;
  document.getElementById('stat-mental').textContent = mc;
  document.getElementById('stat-days').textContent = n;
}

function goHome() { window.location.href = 'index.html'; }

renderStats();
renderCalendar();
renderSelected();
</script>
</body>
</html>
